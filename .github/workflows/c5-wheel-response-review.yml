name: C5 wheel metadata offline response review
on:
  push:
    branches: [feature/live-dev-workspace-20261023]
    paths:
      - .github/workflows/c5-wheel-response-review.yml
      - qa/c5_wheel_metadata/response_review.py
permissions:
  contents: read
jobs:
  offline-response-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - run: python3 -I -B qa/c5_wheel_metadata/response_review.py --self-test
