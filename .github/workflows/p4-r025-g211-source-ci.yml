name: R02.5 G2.11 bounded injected PSS source contract

# Synthetic Python-only candidate; no hosted Windows runner, product launch,
# real PSS/ETW, owner data, installer, or one-use native activation.
on:
  push:
    branches:
      - fix/p4-r025-g211-pss-scoped-source-20261123

permissions:
  contents: read

jobs:
  synthetic-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout exact CI source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Python 3.11
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - name: Syntax-check reviewed source without writing bytecode
        shell: bash
        run: |
          python -B - <<'PY'
          import ast
          from pathlib import Path
          for path in (
              'qa/p4_research/n12_pss_scoped_source_plan.py',
              'tests/test_p4_n12_g2_11_pss_scoped_source_plan.py',
          ):
              ast.parse(Path(path).read_text(encoding='utf-8'), path)
          PY
      - name: Run G2.11 injected snapshot and cleanup adversaries
        run: python -B -m unittest discover -s tests -p 'test_p4_n12_g2_11_pss_scoped_source_plan.py' -v
      - name: Re-run existing PSS gate and strict FileIO pair regressions
        run: |
          python -B -m unittest discover -s tests -p 'test_p4_n12_g2_10_pss_file_handle_candidates.py' -v
          python -B -m unittest discover -s tests -p 'test_p4_n12_fileio_pair_contract.py' -v
