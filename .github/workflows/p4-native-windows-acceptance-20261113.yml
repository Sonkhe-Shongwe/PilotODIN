name: P4 Isolated Windows Native Acceptance (13 November 2026)

# Single owner-approved push against the reviewed application/QA source.
on:
  push:
    branches:
      - feature/live-dev-workspace-20261023
    paths:
      - 'qa/p4_native/P4_WINDOWS_ACCEPTANCE_APPROVAL_20261113.txt'

permissions:
  contents: read

concurrency:
  group: pilotodin-p4-native-acceptance-20261113
  cancel-in-progress: false

jobs:
  windows-preflight:
    if: ${{ github.run_attempt == 1 && github.event.before == '07f736cb71ee1280e6e24745498db50060825e09' }}
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - name: Checkout exact approved source without retained credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Verify source parent and distinct app identities before native compilation
        shell: pwsh
        run: ./qa/p4_native/Run_P4_71_Disposable_Windows.ps1 -ValidateRuntime

  windows-native-acceptance:
    needs: windows-preflight
    if: ${{ github.run_attempt == 1 }}
    name: ONE unpackaged native DEV compilation and controlled synthetic QA
    runs-on: windows-2022
    timeout-minutes: 100
    env:
      CI: 'true'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout exact source without retained credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Recheck isolation preflight on compile runner
        shell: pwsh
        run: ./qa/p4_native/Run_P4_71_Disposable_Windows.ps1 -ValidateRuntime
      - name: Python 3.11 for disposable loopback backend
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Node 22 for native smoke
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Rust MSVC for ONE unpackaged developer native build
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Install locked frontend and Python requirements without compilation
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          npm ci --prefix frontend --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'npm ci failed before native compilation' }
          python -m pip install -r backend/requirements.txt
          if ($LASTEXITCODE -ne 0) { throw 'Python requirements failed before native compilation' }
          node --check frontend/e2e/p4-71-native-webview-qa.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Native QA probe syntax check failed' }
          node --test frontend/e2e/p4-72-cdp-target-classifier.test.mjs frontend/e2e/p4-73-cdp-target-discovery.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Native QA discovery unit checks failed before compilation' }
      - name: Single native DEV compilation plus synthetic WebView2 QA
        shell: pwsh
        run: ./qa/p4_native/Run_P4_71_Disposable_Windows.ps1
      - name: Verify no installer and no output transfer
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bundle = 'frontend/src-tauri/target/debug/bundle'
          if (Test-Path -LiteralPath $bundle) {
            $packages = @(Get-ChildItem -LiteralPath $bundle -Recurse -File |
              Where-Object { $_.Extension -in @('.msi','.msix','.exe') })
            if ($packages.Count -gt 0) { throw 'FAIL: unexpected installer output' }
          }
          Write-Host 'NO INSTALLER, NO EXE TRANSFER/UPLOAD, NO OWNER PC ACCESS.'
