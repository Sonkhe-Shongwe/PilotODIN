name: P4 C1 C2 owned-host integration (one-use proposal)

# Native job is DISARMED. Source preflight parses both variants only.
'on':
  push:
    branches: [feature/live-dev-workspace-20261023]
    paths: ['.github/workflows/p4-c1-c2-owned-host-once.yml', 'qa/c1_c2_owned_host_preflight.rb']

permissions:
  contents: read

concurrency:
  group: pilotodin-c1-c2-owned-host-synthetic-20261124
  cancel-in-progress: false

jobs:
  source-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout exact source for parsing only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Parse both complete YAML variants and scripts
        shell: bash
        env:
          C1_C2_HOST_EVENT_MESSAGE: ${{ github.event.head_commit.message }}
        run: ruby qa/c1_c2_owned_host_preflight.rb
  c1-c2-owned-host-integration:
    needs: source-preflight
    if: ${{ false }} # DISARMED OWNED HOST; fresh exact approval required.
    runs-on: windows-2022
    timeout-minutes: 65
    env:
      CARGO_INCREMENTAL: '0'
    steps:
      - name: Checkout exact reviewed product source without credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 1d23ea139762d94d25e689c4c3489b72fb34acc9
          persist-credentials: false
      - name: Verify reviewed source and toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_RUN_ATTEMPT -ne '1') { throw 'Approval consumed' }
          if ((git rev-parse HEAD).Trim() -ne '1d23ea139762d94d25e689c4c3489b72fb34acc9') { throw 'Wrong reviewed source' }
          if ((git hash-object frontend/src-tauri/Cargo.lock).Trim() -ne 'f635ba1f8257266c242429e2b44ae94b039329b9') { throw 'Cargo lock changed' }
          if ((git rev-parse HEAD:third_party/tauri-plugin-shell-2.6.0).Trim() -ne '54514a2feed82db5a61e9c37e8d43f6fe99b7696') { throw 'Reviewed shell derivative changed' }
          if ((git rev-parse HEAD:frontend/src-tauri).Trim() -ne '53318b86bf97ff0d2ff5ffe896863bfed6c318b6') { throw 'Reviewed native source changed' }
          if ((git rev-parse HEAD:backend).Trim() -ne '3ee7f6799916c9eea7f945fb856e56223ee0e2da') { throw 'Reviewed broker changed' }
          if ((git hash-object qa/c1_c2_owned_host_fixture.py).Trim() -ne '4f162d6f94606b2cab656ddc91495747dc012e91') { throw 'Reviewed fixture changed' }
          rustc +stable --version
          if ($LASTEXITCODE -ne 0) { throw 'Hosted Rust unavailable' }
          cargo +stable --version
          if ($LASTEXITCODE -ne 0) { throw 'Hosted Cargo unavailable' }
          $targets = rustup target list --installed --toolchain stable
          if ($LASTEXITCODE -ne 0 -or 'x86_64-pc-windows-msvc' -notin $targets) { throw 'Hosted MSVC target unavailable' }
          python --version
          if ($LASTEXITCODE -ne 0) { throw 'Hosted Python unavailable' }
          Write-Host 'REVIEWED-SOURCE 1d23ea139762d94d25e689c4c3489b72fb34acc9'
          Write-Host "LOCK-SHA256 $((Get-FileHash frontend/src-tauri/Cargo.lock -Algorithm SHA256).Hash)"
      - name: Stage intentionally invalid compile-only fixtures
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tauri = 'frontend/src-tauri'
          $marker = "$tauri/NATIVE_COMPILE_PROBE_ONLY.txt"
          $assets = @(
            "$tauri/binaries/pilotodin-engine-x86_64-pc-windows-msvc.exe",
            "$tauri/binaries/pilotodin-inference-x86_64-pc-windows-msvc.exe",
            "$tauri/resources/models/qwen3-1.7b-q4_k_m.gguf",
            "$tauri/resources/models/model-manifest.json"
          )
          foreach ($file in ($assets + @($marker, 'frontend/dist'))) {
            if (Test-Path -LiteralPath $file) { throw "Refusing to overwrite existing asset: $file" }
          }
          Set-Content -LiteralPath $marker -Value 'NEVER DISTRIBUTE - C1 C2 SYNTHETIC COMPILE AND LIBRARY TEST ONLY'
          foreach ($file in $assets) {
            [System.IO.File]::WriteAllBytes((Join-Path $PWD $file), [byte[]](0,1,2))
          }
          New-Item -ItemType Directory -Path 'frontend/dist' | Out-Null
          Set-Content -LiteralPath 'frontend/dist/index.html' -Value 'INVALID COMPILE-ONLY FRONTEND; NEVER LAUNCH'
          python desktop/verify_inference_assets.py
          if ($LASTEXITCODE -ne 2) { throw 'Release preflight did not reject invalid fixtures' }
          Write-Host 'RELEASE-PREFLIGHT-REJECTED; no real runtime/model assets'
          exit 0
      - name: Locked all-targets check and single exact ignored owned-host test
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          if ($env:GITHUB_RUN_ATTEMPT -ne '1') { throw 'Approval consumed' }
          $root = Join-Path $env:RUNNER_TEMP "pilotodin-c1-c2-compile-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $fixture = Join-Path $env:RUNNER_TEMP "pilotodin-c1-c2-owned-host-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          foreach ($dir in @($root,$fixture)) {
            if (Test-Path -LiteralPath $dir) { throw 'Existing synthetic root refused' }
            New-Item -ItemType Directory -Path $dir | Out-Null
          }
          $testTemp = Join-Path $root 'test-temp'
          New-Item -ItemType Directory -Path $testTemp | Out-Null
          $env:CARGO_TARGET_DIR = Join-Path $root 'target'
          cargo +stable check --locked --all-targets --manifest-path frontend/src-tauri/Cargo.toml --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { throw 'Owned host locked all-targets check failed' }
          Write-Host 'C1-C2-HOST-LOCKED-ALL-TARGETS-PASS'
          $env:TEMP = $testTemp
          $env:TMP = $testTemp
          $env:PILOTODIN_C1_C2_FIXTURE_ROOT = $fixture
          $env:PILOTODIN_C1_C2_FIXTURE_PYTHON = (Get-Command python.exe -CommandType Application -ErrorAction Stop).Source
          $env:PILOTODIN_C1_C2_FIXTURE_APPROVAL = 'OWNED_HOST_SYNTHETIC_ONCE'
          $expected = 'resource_integration_fixture::actual_owned_pipe_job_and_writer_lifecycle'
          $log = Join-Path $root 'test.log'
          try {
            cargo +stable test --locked --manifest-path frontend/src-tauri/Cargo.toml --target x86_64-pc-windows-msvc --lib -- --ignored --exact --test-threads=1 --nocapture $expected 2>&1 | Tee-Object -FilePath $log
            if ($LASTEXITCODE -ne 0) { throw "Owned host synthetic fixture failed: $LASTEXITCODE" }
          } finally {
            Remove-Item Env:PILOTODIN_C1_C2_FIXTURE_APPROVAL -ErrorAction SilentlyContinue
          }
          $output = Get-Content -LiteralPath $log -Raw
          if ($output -notmatch 'test result: ok\. 1 passed; 0 failed; 0 ignored;') { throw 'Unexpected owned host test count' }
          if ($output -notmatch [regex]::Escape($expected)) { throw 'Missing exact fixture test' }
          if ($output -notmatch 'C1-C2-INFERENCE-GROUP-ZERO: retained owned job observed empty after release') { throw 'Missing real inference group witness' }
          if ($output -notmatch 'C1-C2-ACTUAL-OWNED-HOST-PASS: real pipes; real job descendant and zero; shared lane; joined saves; graceful STOP') { throw 'Missing real shared-host lifecycle result' }
          if ((git hash-object frontend/src-tauri/Cargo.lock).Trim() -ne 'f635ba1f8257266c242429e2b44ae94b039329b9') { throw 'Cargo lock changed' }
          git diff --exit-code
          if ($LASTEXITCODE -ne 0) { throw 'Tracked source changed during fixture' }
          Write-Host 'C1-C2-OWNED-HOST-VERIFICATION-PASS 1/1; disposable fixture roots retained on runner; no product launch'
      - name: Remove only owned compile-only placeholders
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tauri = 'frontend/src-tauri'
          $marker = "$tauri/NATIVE_COMPILE_PROBE_ONLY.txt"
          if (-not (Test-Path -LiteralPath $marker)) { return }
          $assets = @(
            "$tauri/binaries/pilotodin-engine-x86_64-pc-windows-msvc.exe",
            "$tauri/binaries/pilotodin-inference-x86_64-pc-windows-msvc.exe",
            "$tauri/resources/models/qwen3-1.7b-q4_k_m.gguf",
            "$tauri/resources/models/model-manifest.json",
            'frontend/dist/index.html'
          )
          foreach ($file in $assets) {
            if (Test-Path -LiteralPath $file) {
              if ((Get-Item -LiteralPath $file).Length -gt 256) { throw "Unexpected content; refusing cleanup: $file" }
              Remove-Item -LiteralPath $file -Force
            }
          }
          if (Test-Path -LiteralPath 'frontend/dist') {
            if (@(Get-ChildItem -LiteralPath 'frontend/dist' -Force).Count -ne 0) { throw 'Unexpected frontend fixture content' }
            Remove-Item -LiteralPath 'frontend/dist'
          }
          Remove-Item -LiteralPath $marker
          Write-Host 'COMPILE-ONLY-FIXTURES-REMOVED; no executable artifact upload or application launch'
