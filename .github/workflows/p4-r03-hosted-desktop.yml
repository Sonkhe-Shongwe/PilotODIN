name: P4 R03 Hosted Desktop Qwen Startup

on:
  push:
    branches: [feature/live-dev-workspace-20261023]
    paths: [qa/p4_research/R03_HOSTED_DESKTOP_APPROVAL.txt]

permissions:
  contents: read

concurrency:
  group: pilotodin-p4-r03-hosted-desktop
  cancel-in-progress: false

jobs:
  desktop:
    if: ${{ github.run_attempt == '1' }}
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Verify one-use approval and check out the reviewed product source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $source = '4f3824c2f565f33a87f0195844d2d73242cf7571'
          $marker = 'qa/p4_research/R03_HOSTED_DESKTOP_APPROVAL.txt'
          $driver = 'frontend/e2e/p4-r03-hosted-desktop.mjs'
          $workflow = '.github/workflows/p4-r03-hosted-desktop.yml'
          if ($env:GITHUB_EVENT_NAME -cne 'push' -or $env:GITHUB_RUN_ATTEMPT -cne '1' -or
              $env:GITHUB_REF_NAME -cne 'feature/live-dev-workspace-20261023' -or
              $env:RUNNER_ENVIRONMENT -cne 'github-hosted' -or $env:RUNNER_OS -cne 'Windows' -or
              (git rev-parse HEAD) -cne $env:GITHUB_SHA) {
            throw 'Expected the first attempt of the approved hosted Windows push.'
          }
          $approval = @(Get-Content -LiteralPath $marker)
          $parents = (git rev-list --parents -n 1 HEAD) -split ' '
          $added = @(git diff --name-only --diff-filter=A $source HEAD)
          $changed = @(git diff --name-only $source HEAD)
          if ($approval.Count -ne 2 -or $approval[0] -cne "reviewed_source=$source" -or
              $approval[1] -cne 'scope=r03-one-unpackaged-desktop-build-one-qwen-request' -or
              $parents.Count -ne 2 -or $parents[1] -cne $source -or $changed.Count -ne 3 -or
              $added.Count -ne 3 -or $marker -cnotin $added -or $driver -cnotin $added -or $workflow -cnotin $added) {
            throw 'The approved launch must add only the marker, driver and workflow to the pinned source.'
          }
          Copy-Item -LiteralPath $driver -Destination (Join-Path $env:RUNNER_TEMP 'p4-r03-hosted-desktop.mjs')
          git checkout --detach $source
          "PILOTODIN_R03_SOURCE=$source" >> $env:GITHUB_ENV
          Write-Host "R03 source SHA PINNED: $source"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Preflight isolated identity, toolchain and frontend
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $identity = 'com.pilotodin.p4r03hosted'
          foreach ($root in @($env:LOCALAPPDATA,$env:APPDATA)) {
            foreach ($name in @('com.pilotodin.studio','com.pilotodin.p4nativeqa',$identity)) {
              if (Test-Path -LiteralPath (Join-Path $root $name)) { throw 'Expected clean disposable app data.' }
            }
          }
          if ($env:PILOTODIN_HOME -or $env:TAURI_CONFIG -or $env:WEBVIEW2_USER_DATA_FOLDER -or
              $env:WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS -or $env:VITE_PILOTODIN_NATIVE_SMOKE) {
            throw 'Unexpected inherited app configuration.'
          }
          if ('x86_64-pc-windows-msvc' -cnotin @(rustup target list --installed)) {
            throw 'The hosted image must supply the Windows x64 MSVC target.'
          }
          if (Get-NetTCPConnection -ErrorAction SilentlyContinue -State Listen -LocalPort 9331) {
            throw 'The private WebView2 debug port is already in use.'
          }
          node --check (Join-Path $env:RUNNER_TEMP 'p4-r03-hosted-desktop.mjs')
          npm ci --prefix frontend --no-audit --no-fund
          npm run build --prefix frontend
      - name: Stage hash-verified Qwen assets and the existing Windows engine
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          ./desktop/Stage_Pinned_Offline_AI.ps1
          ./desktop/Build_Python_Sidecar.ps1
      - name: Compile and fingerprint one unpackaged desktop
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          if ((git rev-parse HEAD) -cne $env:PILOTODIN_R03_SOURCE -or
              @(git status --porcelain --untracked-files=no).Count -ne 0) {
            throw 'Product source differs from the approved checkout.'
          }
          $crate = Join-Path $PWD 'frontend/src-tauri'
          $target = Join-Path $env:RUNNER_TEMP "pilotodin-r03-target-$env:GITHUB_RUN_ID"
          $env:TAURI_CONFIG = @{
            identifier = 'com.pilotodin.p4r03hosted'
            productName = 'pilotODIN-P4-R03-Hosted'
            bundle = @{active = $false; targets = @()}
          } | ConvertTo-Json -Depth 6 -Compress
          cargo build --manifest-path (Join-Path $crate 'Cargo.toml') --bin pilotodin-desktop --target x86_64-pc-windows-msvc --target-dir $target --release --features tauri/custom-protocol
          $layout = Join-Path $target 'x86_64-pc-windows-msvc/release'
          foreach ($entry in @('pilotodin-desktop.exe','pilotodin-engine.exe','pilotodin-inference.exe',
                              'models/model-manifest.json','models/qwen3-1.7b-q4_k_m.gguf','llama-runtime')) {
            if (-not (Test-Path -LiteralPath (Join-Path $layout $entry))) {
              throw "Unpackaged runtime layout missing $entry."
            }
          }
          $exe = Join-Path $layout 'pilotodin-desktop.exe'
          $digest = (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "PILOTODIN_R03_EXE=$exe" >> $env:GITHUB_ENV
          "PILOTODIN_R03_EXE_SHA256=$digest" >> $env:GITHUB_ENV
          $lock = (Get-FileHash -LiteralPath (Join-Path $crate 'Cargo.lock') -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "R03 unpackaged desktop SHA-256: $digest"
          Write-Host "R03 Cargo.lock SHA-256: $lock"
      - name: Submit exactly one synthetic Ask ODIN request and observe desktop survival
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $exe = $env:PILOTODIN_R03_EXE
          if ((Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant() -cne $env:PILOTODIN_R03_EXE_SHA256) {
            throw 'The executable differs from its approved-run build receipt.'
          }
          $driver = 'frontend/e2e/p4-r03-hosted-desktop.mjs'
          Copy-Item -LiteralPath (Join-Path $env:RUNNER_TEMP 'p4-r03-hosted-desktop.mjs') -Destination $driver
          $env:PILOTODIN_R03_HOSTED_DESKTOP = 'approved'
          $env:WEBVIEW2_USER_DATA_FOLDER = Join-Path $env:RUNNER_TEMP "pilotodin-r03-profile-$env:GITHUB_RUN_ID"
          $env:WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS = '--remote-debugging-address=127.0.0.1 --remote-debugging-port=9331'
          $app = Start-Process -FilePath $exe -WorkingDirectory (Split-Path -Parent $exe) -PassThru
          try {
            node $driver
            if ($app.HasExited) { throw 'The desktop exited during the exercise.' }
          } finally {
            $app.Refresh()
            if ($app.HasExited) {
              Write-Host ('R03 desktop alive after probe: false; Windows exit code: 0x{0:x8}' -f $app.ExitCode)
            } else {
              Write-Host 'R03 desktop alive after probe: true'
              $null = $app.CloseMainWindow()
              if (-not $app.WaitForExit(12000)) { & taskkill.exe /PID $app.Id /T /F }
            }
          }
