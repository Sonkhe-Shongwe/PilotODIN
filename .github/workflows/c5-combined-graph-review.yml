name: C5 combined selected wheel graph review
on:
  push:
    branches: [feature/live-dev-workspace-20261023]
    paths:
      - .github/workflows/c5-combined-graph-review.yml
      - qa/c5_wheel_metadata/combined_graph.py
permissions:
  contents: read
jobs:
  offline-graph:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Review using existing hosted Python packaging library, no setup
        run: python3 -I -B qa/c5_wheel_metadata/combined_graph.py --review
