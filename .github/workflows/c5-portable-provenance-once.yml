name: C5 capability host observation one-use
on:
  push:
    branches: [feature/live-dev-workspace-20261023]
    paths:
      - .github/workflows/c5-portable-provenance-once.yml
permissions: {}
jobs:
  observe-once:
    if: ${{ true && github.event_name == 'push' && github.run_attempt == 1 && github.event.before == '29fd937178854c2546470a3cac3d5545ee714ded' && github.event.head_commit.message == 'C5-HOST-OBSERVATION-ONCE-20261127 owner approved bounded host observation only' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Observe fixed host components without qualification
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3.12 -I -B -S - <<'PYCODE'
          import hashlib
          source = "\"\"\"Inert C5 diagnostic: observations only, never qualification or acquisition.\"\"\"\nimport hashlib\nimport json\nimport os\nimport re\nimport stat\nfrom pathlib import PurePosixPath\n\nENABLED = False\nROLE_CAP = 128 * 1024 * 1024\nTOTAL_CAP = 1024 * 1024 * 1024\nRECEIPT_CAP = 32 * 1024\nROLES = {\n    'python': ('/usr/bin/python3.12', ('python3.12-minimal',)),\n    'curl': ('/usr/bin/curl', ('curl',)),\n    'ca': ('/etc/ssl/certs/ca-certificates.crt', ('ca-certificates',)),\n    'snappy': ('/usr/lib/x86_64-linux-gnu/libsnappy.so.1', ('libsnappy1v5',)),\n    'unshare': ('/usr/bin/unshare', ('util-linux',)),\n    'readelf': ('/usr/bin/readelf', ('binutils-x86-64-linux-gnu',)),\n    'llvm_readobj': ('/usr/lib/llvm-18/bin/llvm-readobj', ('llvm-18',)),\n    'docker': ('/usr/bin/docker', ('docker-ce-cli', 'docker.io')),\n    'dockerd': ('/usr/bin/dockerd', ('docker-ce', 'docker.io')),\n    'containerd': ('/usr/bin/containerd', ('containerd.io', 'containerd')),\n    'runc': ('/usr/bin/runc', ('containerd.io', 'runc')),\n}\n\n\ndef need(ok, code):\n    if not ok:\n        raise ValueError(code)\n\n\ndef token(value, pattern):\n    need(isinstance(value, str) and re.fullmatch(pattern, value), 'OBS_TOKEN')\n    return value\n\n\ndef context(env, uid, kernel):\n    need(uid != 0 and all(env.get(k) == v for k, v in {\n        'RUNNER_ENVIRONMENT': 'github-hosted', 'RUNNER_OS': 'Linux',\n        'RUNNER_ARCH': 'X64', 'ImageOS': 'ubuntu24',\n        'GITHUB_EVENT_NAME': 'push', 'GITHUB_RUN_ATTEMPT': '1',\n        'GITHUB_REF': 'refs/heads/feature/live-dev-workspace-20261023',\n        'GITHUB_REPOSITORY': 'Sonkhe-Shongwe/PilotODIN',\n        'GITHUB_JOB': 'observe-once',\n    }.items()), 'OBS_CONTEXT')\n    return {'image_version': token(env.get('ImageVersion'), r'[0-9]{8}\\.[0-9]{1,5}\\.[0-9]{1,5}'),\n            'os': 'ubuntu24', 'architecture': 'X64', 'nonroot': True,\n            'kernel': token(kernel, r'[A-Za-z0-9.+_-]{1,128}'),\n            'run_id': token(env.get('GITHUB_RUN_ID'), r'[1-9][0-9]{0,19}'),\n            'commit': token(env.get('GITHUB_SHA'), r'[0-9a-f]{40}'),\n            'attempt': 1, 'job': 'observe-once'}\n\n\ndef fingerprint(s):\n    return (s.st_dev, s.st_ino, s.st_size, s.st_uid, s.st_gid,\n            s.st_mode, s.st_mtime_ns, s.st_ctime_ns)\n\n\ndef canonical(path):\n    # Resolve and check every intermediate alias and directory, not just endpoints.\n    need(path.startswith('/') and '..' not in PurePosixPath(path).parts, 'OBS_PATH')\n    pending = list(PurePosixPath(path).parts[1:])\n    current = []\n    links = 0\n    root = os.lstat('/')\n    need(root.st_uid == 0 and stat.S_ISDIR(root.st_mode) and\n         not root.st_mode & 0o022 and not os.access('/', os.W_OK), 'OBS_OWNER')\n    while pending:\n        part = pending.pop(0)\n        if part == '..':\n            need(bool(current), 'OBS_PATH')\n            current.pop()\n            continue\n        if part in ('', '.'):\n            continue\n        token(part, r'[A-Za-z0-9_.+@-]{1,255}')\n        candidate = '/' + '/'.join(current + [part])\n        need(candidate in ('/usr', '/usr/bin', '/usr/lib', '/etc', '/var', '/var/lib', '/var/lib/dpkg') or\n             candidate.startswith(('/usr/bin/', '/usr/lib/', '/etc/', '/var/lib/dpkg/')), 'OBS_PATH')\n        s = os.lstat(candidate)\n        need(s.st_uid == 0, 'OBS_OWNER')\n        if stat.S_ISLNK(s.st_mode):\n            links += 1\n            need(links <= 40, 'OBS_LINK')\n            target = os.readlink(candidate)\n            need(0 < len(target) <= 4096, 'OBS_LINK')\n            if target.startswith('/'):\n                current = []\n            pending = list(PurePosixPath(target).parts[(1 if target.startswith('/') else 0):]) + pending\n            need(len(pending) <= 128, 'OBS_LINK')\n        else:\n            need(not s.st_mode & 0o022 and not os.access(candidate, os.W_OK), 'OBS_WRITABLE')\n            need(stat.S_ISDIR(s.st_mode) if pending else stat.S_ISREG(s.st_mode), 'OBS_TYPE')\n            current.append(part)\n    result = '/' + '/'.join(current)\n    need(result.startswith(('/usr/bin/', '/usr/lib/', '/etc/', '/var/lib/dpkg/')), 'OBS_PATH')\n    allowed = {path}\n    if path == '/etc/os-release':\n        allowed.add('/usr/lib/os-release')\n    if path == '/usr/bin/readelf':\n        allowed.add('/usr/bin/x86_64-linux-gnu-readelf')\n    snappy_alias = (path == ROLES['snappy'][0] and\n                    re.fullmatch(r'/usr/lib/x86_64-linux-gnu/libsnappy\\.so\\.1(?:\\.[0-9]{1,4}){1,3}', result))\n    need(result in allowed or snappy_alias, 'OBS_ALIAS')\n    return result\n\n\ndef measure(path, cap, capture=False):\n    real = canonical(path)\n    flags = os.O_RDONLY | os.O_NOFOLLOW | os.O_NONBLOCK\n    with os.fdopen(os.open(real, flags), 'rb') as stream:\n        before = os.fstat(stream.fileno())\n        need(stat.S_ISREG(before.st_mode) and before.st_uid == 0 and\n             not before.st_mode & 0o022 and 0 < before.st_size <= cap, 'OBS_BOUND')\n        digest = hashlib.sha256()\n        count = 0\n        data = bytearray()\n        while chunk := stream.read(min(65536, cap - count + 1)):\n            count += len(chunk)\n            need(count <= cap, 'OBS_BOUND')\n            digest.update(chunk)\n            if capture:\n                data.extend(chunk)\n        after = os.fstat(stream.fileno())\n        need(canonical(path) == real and fingerprint(before) == fingerprint(after) ==\n             fingerprint(os.lstat(real)) and count == before.st_size, 'OBS_CHANGED')\n    return {'configured_path': path, 'path': real, 'bytes': count,\n            'sha256': digest.hexdigest(), 'mode': stat.S_IMODE(before.st_mode),\n            'uid': before.st_uid, 'gid': before.st_gid}, bytes(data)\n\n\ndef packages(raw):\n    wanted = {name for _, names in ROLES.values() for name in names}\n    result = {}\n    for stanza in raw.decode('utf-8').split('\\n\\n'):\n        fields = {}\n        for line in stanza.splitlines():\n            if line.startswith(('Package: ', 'Version: ', 'Status: ', 'Architecture: ')):\n                key, value = line.split(': ', 1)\n                need(key not in fields, 'OBS_PACKAGE_DUPLICATE')\n                fields[key] = value\n        name = fields.get('Package')\n        if name in wanted and fields.get('Status') == 'install ok installed':\n            need(name not in result and fields.get('Architecture') in ('amd64', 'all'), 'OBS_PACKAGE')\n            result[name] = {'name': name, 'architecture': fields['Architecture'],\n                            'version': token(fields.get('Version'), r'[A-Za-z0-9.+:~_-]{1,128}')}\n    return result\n\n\ndef collect(ctx, read=measure):\n    _, release = read('/etc/os-release', 65536, True)\n    lines = release.decode('utf-8').splitlines()\n    ids = [x for x in lines if x.startswith('ID=')]\n    versions = [x for x in lines if x.startswith('VERSION_ID=')]\n    need(ids == ['ID=ubuntu'] and versions in (['VERSION_ID=\"24.04\"'], ['VERSION_ID=24.04']), 'OBS_DISTRO')\n    _, status = read('/var/lib/dpkg/status', 32 * 1024 * 1024, True)\n    installed = packages(status)\n    total = 0\n    roles = {}\n    for role, (path, names) in ROLES.items():\n        options = [installed[n] for n in names if n in installed]\n        need(len(options) == 1, 'OBS_PACKAGE_MAPPING')\n        cap = min(ROLE_CAP, TOTAL_CAP - total)\n        need(cap > 0, 'OBS_TOTAL')\n        row, _ = read(path, cap)\n        need(0 < row['bytes'] <= cap, 'OBS_BOUND')\n        if role not in ('ca', 'snappy'):\n            need(row['mode'] & 0o111, 'OBS_EXECUTABLE')\n        total += row['bytes']\n        roles[role] = dict(row, candidate_package=options[0])\n    need(len({row['path'] for row in roles.values()}) == len(ROLES), 'OBS_ROLE_COLLISION')\n    return {'schema': 1, 'kind': 'OBSERVATION_ONLY_NOT_INDEPENDENT_PROVENANCE',\n            'context': ctx, 'roles': roles, 'total_role_bytes': total,\n            'qualification': False, 'package_mapping': 'CANDIDATE_NOT_FILE_OWNERSHIP_PROOF'}\n\n\ndef encode(receipt):\n    raw = json.dumps(receipt, sort_keys=True, separators=(',', ':'), ensure_ascii=True).encode('ascii')\n    need(0 < len(raw) <= RECEIPT_CAP, 'OBS_RECEIPT_BOUND')\n    return raw\n\n\ndef main():\n    need(ENABLED, 'OBS_DISARMED')\n    try:\n        ctx = context(os.environ, os.geteuid(), os.uname().release)\n        raw = encode(collect(ctx))\n    except (OSError, UnicodeError, ValueError, KeyError):\n        # No exception paths, raw environment, package database or partial receipt.\n        print('C5_OBSERVATION_REFUSED', flush=True)\n        raise SystemExit(1) from None\n    print('C5_OBSERVATION_SHA256 ' + hashlib.sha256(raw).hexdigest(), flush=True)\n    print('C5_OBSERVATION_JSON ' + raw.decode('ascii'), flush=True)\n\n\nif __name__ == '__main__':\n    main()\n"
          if hashlib.sha256(source.encode('ascii')).hexdigest() != 'a23688c4450a67d073e49ce501b892c089fc4ba358be936ff24fa1ea830b8f7a': raise SystemExit('OBS_SOURCE_PIN')
          if source.count('ENABLED = False') != 1: raise SystemExit('OBS_SOURCE_ANCHOR')
          active = source.replace('ENABLED = False', 'ENABLED = True')
          if hashlib.sha256(active.encode('ascii')).hexdigest() != '45cc2d2761c49a66c5c5d634863e7132c3d75b37eccc9774b88ed54ced4fca1e': raise SystemExit('OBS_ACTIVE_PIN')
          exec(compile(active, '<pinned-host-observation>', 'exec'), {'__name__': '__main__'})
          PYCODE
