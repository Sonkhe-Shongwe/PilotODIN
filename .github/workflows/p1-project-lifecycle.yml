name: P1 Project Lifecycle Disposable Backend Acceptance

on:
  push:
    branches:
      - feature/live-dev-workspace-20261023
    paths:
      - .github/workflows/p1-project-lifecycle.yml
      - backend/storage.py
      - backend/project_lifecycle.py
      - backend/quality.py
      - backend/quality_approvals.py
      - backend/reports.py
      - backend/saved_analyses.py
      - backend/investigations.py
      - backend/project_delete_impact.py
      - backend/main.py
      - tests/test_p1_project_lifecycle.py
      - backend/dataset_publication.py
      - backend/artifact_publication.py
      - backend/import_preflight.py
      - backend/engine.py
      - backend/workspace_boundary.py
      - backend/report_charts.py
      - backend/pdf_release_font_loader.py
      - backend/requirements.txt
      - backend/requirements-test.txt
      - tests/test_cf04_quality_preview_transaction.py
      - tests/test_cf04_quality_commit_transaction.py
      - tests/test_build_e_approval_receipts.py
      - tests/test_a4_quality_audit_reporting.py
      - tests/test_b4_quality_resource_measurement.py
      - tests/test_b4_quality_metadata_bounds.py
      - backend/export_publication.py
      - backend/data_exports.py
      - backend/export_transfer.py
      - tests/test_b5_live_export_transfer.py
      - tests/test_b5_bounded_export_writer.py
      - backend/maintenance_backup.py
      - tests/test_b5_export_startup.py
      - tests/test_b5_export_publication.py
      - tests/test_build_e_cleaned_exports.py
      - tests/test_quality_increment1.py
      - tests/test_quality_deep_investigations.py
      - tests/test_p3_semantic_profile.py
      - tests/test_p3_semantic_business_context.py
      - tests/test_p3_human_semantic_review.py
      - tests/test_a4_model_evidence_reports.py
      - tests/test_cf01_import_preflight.py

permissions:
  contents: read

concurrency:
  group: pilotodin-p1-project-lifecycle
  cancel-in-progress: true

jobs:
  lifecycle:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Use an isolated runner-owned data home
        run: echo "PILOTODIN_HOME=${RUNNER_TEMP}/pilotodin-project-lifecycle-${GITHUB_RUN_ID}" >> "$GITHUB_ENV"
      - name: Checkout without saved credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Python 3.11
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - name: Install existing test requirements
        run: python -m pip install -r backend/requirements-test.txt
      - name: Validate source syntax
        run: python -m compileall -q backend/project_lifecycle.py backend/project_delete_impact.py backend/storage.py backend/main.py backend/quality.py backend/quality_approvals.py backend/reports.py backend/saved_analyses.py backend/investigations.py tests/test_p1_project_lifecycle.py
      - name: Exercise reversible synthetic project lifecycle
        run: python -m pytest -q tests/test_p1_project_lifecycle.py tests/test_p1_real_api_failed_switch.py tests/test_p1_import_recovery.py
      - name: Exercise B4 approval transactions and immutable audit reports in separate disposable stores
        run: |
          status=0
          for suite in test_cf04_quality_preview_transaction test_cf04_quality_commit_transaction test_build_e_approval_receipts test_a4_quality_audit_reporting; do
            echo "::group::${suite}"
            PILOTODIN_HOME="${RUNNER_TEMP}/pilotodin-b4-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${suite}" python -m pytest -q "tests/${suite}.py" || status=1
            echo "::endgroup::"
          done
          exit "$status"
      - name: Verify existing CSV and XLSX admission limits
        env:
          PILOTODIN_HOME: ${{ runner.temp }}/pilotodin-b4-preflight-${{ github.run_id }}-${{ github.run_attempt }}
        run: python -m pytest -q tests/test_cf01_import_preflight.py
      - name: Measure B4 source-boundary approval memory and SQLite writer intervals
        env:
          PILOTODIN_HOME: ${{ runner.temp }}/pilotodin-b4-measurement-${{ github.run_id }}-${{ github.run_attempt }}
        run: python -m pytest -q -s tests/test_b4_quality_resource_measurement.py
      - name: Exercise B4 history admission and refusal with disposable metadata
        env:
          PILOTODIN_HOME: ${{ runner.temp }}/pilotodin-b4-metadata-${{ github.run_id }}-${{ github.run_attempt }}
        run: python -m pytest -q -s tests/test_b4_quality_metadata_bounds.py
      - name: Verify downstream Quality, semantic and stored report evidence compatibility
        run: |
          status=0
          for suite in test_quality_increment1 test_quality_deep_investigations test_p3_semantic_profile test_p3_semantic_business_context test_p3_human_semantic_review test_a4_model_evidence_reports; do
            echo "::group::${suite}"
            PILOTODIN_HOME="${RUNNER_TEMP}/pilotodin-b4-compat-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${suite}" python -m pytest -q "tests/${suite}.py" || status=1
            echo "::endgroup::"
          done
          exit "$status"
      - name: Verify typed export receipt transitions and existing cleaned exports
        env:
          PILOTODIN_B5_FIXTURE_DIR: ${{ runner.temp }}/pilotodin-b5-native-fixture-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          status=0
          for suite in test_b5_export_publication test_b5_export_startup test_b5_bounded_export_writer test_b5_live_export_transfer test_build_e_cleaned_exports; do
            echo "::group::${suite}"
            PILOTODIN_HOME="${RUNNER_TEMP}/pilotodin-b5-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${suite}" python -m pytest -q "tests/${suite}.py" || status=1
            echo "::endgroup::"
          done
          exit "$status"

      - name: Publish generated synthetic workbook fixture (not native acceptance)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: B5-backend-generated-xlsx-SYNTHETIC-ONLY
          path: ${{ runner.temp }}/pilotodin-b5-native-fixture-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: error
          retention-days: 7
