name: C5 selected-wheel metadata v2 offline integration
on:
  push:
    branches: [feature/live-dev-workspace-20261023]
    paths:
      - qa/c5_wheel_metadata/APPROVAL_V2_20261125.txt
permissions:
  contents: read
jobs:
  offline-integration:
    if: ${{ false }} # Exact prior offline verification preserved.
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - run: python3 -I -B qa/c5_wheel_metadata/collect_v2.py --self-test
      - name: Assert CLI refuses collection
        run: |
          set +e
          python3 -I -B qa/c5_wheel_metadata/collect_v2.py --collect
          code=$?
          set -e
          test "$code" = 2
  collect-once:
    if: ${{ false }} # Approval issued to exact run 45700172241 attempt 1; never replay.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - run: python3 -I -B qa/c5_wheel_metadata/collect_v2.py --self-test
      - name: Verify exact activated collector blob
        run: test "$(git hash-object qa/c5_wheel_metadata/collect_v2.py)" = 80a67f50f89d7f21daff165a4e9feadb3aa49618
      - name: Metadata only, approved one use
        env:
          C5_APPROVED_ONCE: C5-SELECTED-WHEEL-METADATA-V2-ONCE-20261125
          C5_EXPECTED_SOURCE_SHA: ${{ github.sha }}
        run: python3 -I -B qa/c5_wheel_metadata/collect_v2.py --collect
