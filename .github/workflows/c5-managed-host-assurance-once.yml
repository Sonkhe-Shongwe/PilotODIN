          test "$(git rev-parse 'HEAD:qa/c5_managed_dev/c5_systemd_fixture_launcher.py')" = '1d9f3f5c707daeb188e44970720eb373444e19ab'
          test "$(git rev-parse 'HEAD:qa/c5_managed_dev/test_c5_systemd_fixture_launcher.py')" = '3e4e0eba1248d139a9923b9ba78538b9377ee464'
          test "$(git rev-parse 'HEAD:qa/c5_managed_dev/test_c5_systemd_observe_generated.py')" = 'c6511e0ccbb787e2156b6ea8608765ba79136f5b'
