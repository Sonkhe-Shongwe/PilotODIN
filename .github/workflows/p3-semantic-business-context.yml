name: P3 User-Described Semantic Business Context

# Synthetic project/version fixtures only. No owner datasets, installers, model fitting,
# cloud inference, original font assets or new release builds.
on:
  push:
    branches:
      - feature/live-dev-workspace-20261023
    paths:
      - .github/workflows/p3-semantic-business-context.yml
      - backend/main.py
      - backend/storage.py
      - backend/semantic_profile.py
      - frontend/src/SemanticContextEditor.tsx
      - frontend/src/SemanticOverview.tsx
      - frontend/src/p3SemanticReview.ts
      - frontend/src/ColumnInvestigation.tsx
      - tests/test_p3_semantic_business_context.py
      - tests/test_p3_semantic_profile.py
      - frontend/tests/p3-semantic-business-context-contracts.test.cjs
      - frontend/tests/p3-semantic-profile-contracts.test.cjs
      - Run_PilotODIN_P3_Native_Semantic_QA.bat
      - tools/Seed_P3_Native_Semantic_Context_Local.py
      - tools/Run_P3_Native_Semantic_QA_Local.ps1
      - frontend/p3_native_semantic_qa.html
      - frontend/src/p3NativeSemanticQa.tsx
      - frontend/src-tauri/tauri.p3-native-semantic-qa.conf.json
      - tests/test_p3_native_qa_source.py
      - Run_PilotODIN_P3_Native_Quality_W5_QA.bat
      - tools/Seed_P3_Native_Quality_W5_Local.py
      - tools/Run_P3_Native_Quality_W5_QA_Local.ps1
      - frontend/p3_native_quality_w5_qa.html
      - frontend/src/p3NativeQualityW5Qa.tsx
      - frontend/src-tauri/tauri.p3-native-quality-w5-qa.conf.json
      - tests/test_p3_native_quality_w5_source.py
      - tools/Verify_P3_Native_Quality_W5_Status.py tools/Verify_P3_Native_Quality_W5_History_Local.py
      - tools/Verify_P3_Native_Quality_W5_History_Local.py
      - tests/test_p3_native_quality_w5_history.py
      - tests/test_p3_w5_archive_verifier.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pilotodin-p3-semantic-context-${{ github.ref }}
  cancel-in-progress: true

jobs:
  synthetic-semantic-context:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: "true"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout trusted branch without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Python 3.11
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"
      - name: Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install existing backend test requirements and locked frontend packages
        run: |
          python -m pip install -r backend/requirements-test.txt
          npm ci --prefix frontend --no-audit --no-fund
      - name: Compile modified Python modules
        run: python -m py_compile backend/storage.py backend/main.py tools/Seed_P3_Native_Semantic_Context_Local.py tools/Seed_P3_Native_Quality_W5_Local.py tools/Verify_P3_Native_Quality_W5_Status.py
      - name: Run P3 new and affected previous Python contracts
        env:
          PILOTODIN_HOME: ${{ runner.temp }}/p3-semantic-context-${{ github.run_id }}
        run: >-
          python -m pytest -q tests/test_p3_semantic_business_context.py
          tests/test_p3_semantic_profile.py
          tests/test_p4_target_business_context.py
          tests/test_p3_native_qa_source.py tests/test_p3_native_quality_w5_source.py
          tests/test_p3_w5_archive_verifier.py
          tests/test_p3_native_quality_w5_history.py
      - name: Verify affected frontend API and UI source contracts
        run: >-
          node --test
          frontend/tests/p3-semantic-business-context-contracts.test.cjs
          frontend/tests/p3-semantic-profile-contracts.test.cjs
      - name: Build actual frontend TypeScript and Vite bundle
        run: npm run build --prefix frontend

  p3-native-powershell-parser:
    # Syntax-only Windows validation. Does NOT open WebView2 or run owner acceptance.
    runs-on: windows-2022
    timeout-minutes: 6
    steps:
      - name: Checkout trusted source without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Parse P3 synthetic native QA launcher in Windows PowerShell
        shell: powershell
        run: |
          $tokens = $null
          $parseErrors = $null
          foreach ($name in @('Run_P3_Native_Semantic_QA_Local.ps1', 'Run_P3_Native_Quality_W5_QA_Local.ps1')) {
            $source = Join-Path $env:GITHUB_WORKSPACE ('tools\' + $name)
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($source, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors -and $parseErrors.Count -gt 0) {
              $parseErrors | ForEach-Object { Write-Host $_.Message }
              throw ('P3 native QA PowerShell parse failed: ' + $name)
            }
          }
          Write-Host 'Both P3 PowerShell scripts parse. Native W1-W4 not rerun, W5 not tested.'
