name: P1 Disposable Real HTTP Browser/Backend Acceptance

# Trusted direct feature-branch push only; never run automatically for a fork PR.
on:
  push:
    branches:
      - feature/live-dev-workspace-20261023
    paths:
      - .github/workflows/p1-real-http-browser.yml
      - tools/p1_real_http_fixture_guard.py
      - frontend/playwright.p1-real-http.config.ts
      - frontend/e2e/p1-real-http.spec.ts
      - frontend/e2e/p1-real-http-quality-approval.spec.ts
      - frontend/e2e/p1-real-http-backend.ts
      # Rerun actual disposable-backend Quality recovery whenever its
      # production view or snapshot-ordering code changes.
      - frontend/src/QualityWorkspace.tsx
      - frontend/src/qualityReadGuard.ts

permissions:
  contents: read

concurrency:
  group: pilotodin-p1-real-http-feature-20261023
  cancel-in-progress: true

jobs:
  temporary-full-http:
    name: Disposable Uvicorn plus isolated real Chromium
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CI: "true"
      P1_REAL_HTTP_E2E: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Bind a dedicated temporary backend workspace
        run: echo "PILOTODIN_HOME=${RUNNER_TEMP}/pilotodin-p1-real-http-${GITHUB_RUN_ID}" >> "$GITHUB_ENV"
      - name: Checkout trusted source without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Use Python 3.11
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - name: Use Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install existing locked frontend and test backend dependencies
        run: |
          python -m pip install -r backend/requirements-test.txt
          npm ci --prefix frontend --no-audit --no-fund
      - name: Compile fixture safety tool and production backend
        run: python -m compileall -q backend tools/p1_real_http_fixture_guard.py
      - name: Install disposable Chromium
        working-directory: frontend
        run: npx --no-install playwright install --with-deps chromium
      - name: Run isolated real HTTP browser and backend acceptance
        working-directory: frontend
        run: npx --no-install playwright test --config=playwright.p1-real-http.config.ts
