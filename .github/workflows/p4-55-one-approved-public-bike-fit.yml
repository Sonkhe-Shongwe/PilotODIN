name: P4-55 One Approved Public Bike Research Fit (Disposable Only)

# ONE owner-approved context-scoped RESEARCH experiment, 12 Nov 2026.
# Trigger only when the uniquely named research script is first committed.
# Remove this workflow after the single confirmed run. Never expand to CI
# native builds/installers, original owner datasets or cloud model downloads.
on:
  push:
    branches:
      - feature/live-dev-workspace-20261023
    paths:
      - qa/p4_research/p4_55_one_disposable_bike_fit.py

permissions:
  contents: read

concurrency:
  group: p4-55-public-bike-single-fit-20261112
  cancel-in-progress: false

jobs:
  one_disposable_research_fit:
    name: Single real-public-data time-split research fit; no model artifact
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      CI: "true"
    steps:
      - name: Checkout exact feature-branch commit without credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Setup declared Python 3.11
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"
      - name: Install pinned backend test dependencies only
        run: python -m pip install -r backend/requirements-test.txt
      - name: Verify disposable workspace and run the one authorised research fit
        env:
          PILOTODIN_HOME: ${{ runner.temp }}/p4-55-public-bike-single-fit-${{ github.run_id }}
          JOBLIB_TEMP_FOLDER: ${{ runner.temp }}/p4-55-joblib-${{ github.run_id }}
        run: |
          mkdir -p "$PILOTODIN_HOME" "$JOBLIB_TEMP_FOLDER"
          python -m qa.p4_research.p4_55_one_disposable_bike_fit
