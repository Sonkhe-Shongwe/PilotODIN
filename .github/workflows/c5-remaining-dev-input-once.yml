name: C5 remaining development input one-use
on:
  push:
    branches: [feature/live-dev-workspace-20261023]
    paths:
      - qa/c5_wheel_metadata/APPROVAL_PYTHON_REDIRECT_HEADER_ONLY_20261126.json
permissions:
  contents: read
jobs:
  rehearsal:
    if: ${{ false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Existing cached CP311 only, synthetic response fixtures
        shell: bash
        run: |
          set -euo pipefail
          python="$RUNNER_TOOL_CACHE/Python/3.11.18/x64/bin/python3.11"
          test -f "$python"
          "$python" -I -B qa/c5_wheel_metadata/remaining_dev_input_once.py --rehearse
  acquisition-once:
    if: ${{ false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Acquisition-only archive identity verification
        shell: bash
        run: |
          set -euo pipefail
          python="$RUNNER_TOOL_CACHE/Python/3.11.18/x64/bin/python3.11"
          test -f "$python"
          "$python" -I -B qa/c5_wheel_metadata/remaining_dev_input_once.py --live
  header-once:
    if: ${{ github.run_attempt == 1 && github.event_name == 'push' && github.ref == 'refs/heads/feature/live-dev-workspace-20261023' && github.event.head_commit.message == 'C5-PYTHON-REDIRECT-HEADER-ONLY-20261126 owner approved headers only' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Original Python release response headers only
        shell: bash
        run: |
          set -euo pipefail
          python="$RUNNER_TOOL_CACHE/Python/3.11.18/x64/bin/python3.11"
          test -f "$python"
          "$python" -I -B qa/c5_wheel_metadata/remaining_dev_input_once.py --header-live
