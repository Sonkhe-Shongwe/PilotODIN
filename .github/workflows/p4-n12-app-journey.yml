name: P4 N12 Hosted App Journey

on:
  push:
    branches:
      - feature/live-dev-workspace-20261023
    paths:
      - qa/p4_research/N12_APP_JOURNEY_RUNDOWN_APPROVAL.txt

permissions:
  contents: read

concurrency:
  group: pilotodin-p4-n12-app-journey
  cancel-in-progress: false

jobs:
  journey:
    if: ${{ false }} # One-use hosted audit consumed by run 44520473493.
    runs-on: windows-2022
    timeout-minutes: 100
    env:
      CI: 'true'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out the authorised launch commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Verify one-use approval and freeze the reviewed source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $marker = 'qa/p4_research/N12_APP_JOURNEY_RUNDOWN_APPROVAL.txt'
          $workflow = '.github/workflows/p4-n12-app-journey.yml'
          if ($env:GITHUB_EVENT_NAME -cne 'push' -or $env:GITHUB_RUN_ATTEMPT -cne '1' -or
              $env:GITHUB_REF_NAME -cne 'feature/live-dev-workspace-20261023' -or
              $env:RUNNER_ENVIRONMENT -cne 'github-hosted' -or $env:RUNNER_OS -cne 'Windows' -or
              (git rev-parse HEAD) -cne $env:GITHUB_SHA) {
            throw 'The approval applies only to the first run of a trusted hosted Windows push.'
          }
          $approval = @(Get-Content -LiteralPath $marker)
          if ($approval.Count -ne 2 -or $approval[0] -cnotmatch '^reviewed_source=([0-9a-f]{40})$' -or
              $approval[1] -cne 'scope=n12-one-build-one-hosted-journey-with-rundown') {
            throw 'A fresh source-pinned N12 approval marker is required.'
          }
          $source = $Matches[1]
          $parents = (git rev-list --parents -n 1 HEAD) -split ' '
          $changed = @(git diff --name-only $source HEAD)
          $added = @(git diff --name-only --diff-filter=A $source HEAD -- $marker)
          if ($parents.Count -ne 2 -or $parents[1] -cne $source -or
              $changed.Count -ne 2 -or $workflow -cnotin $changed -or $marker -cnotin $changed -or
              $added.Count -ne 1 -or $added[0] -cne $marker) {
            throw 'The launch must be a direct child of the reviewed source and add only the approval and workflow activation.'
          }
          git checkout --detach $source
          "PILOTODIN_N12_APPROVED_SOURCE=$source" >> $env:GITHUB_ENV
          'PILOTODIN_P4_UNPACKAGED_NATIVE_DEV_CONSENT=I_APPROVE_UNPACKAGED_P4_NATIVE_DEV' >> $env:GITHUB_ENV
          'PILOTODIN_N12_APP_JOURNEY_CONSENT=I_APPROVE_ONE_N12_APP_JOURNEY' >> $env:GITHUB_ENV
          'PILOTODIN_N12_APP_RUNDOWN_CONSENT=I_APPROVE_ONE_N12_APP_RUNDOWN' >> $env:GITHUB_ENV
      - name: Set up Python for the local backend and trace audit
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Run the generated calibration helper before dependencies and build
        shell: pwsh
        run: python -B -m qa.p4_research.n12_app_journey --source $env:PILOTODIN_N12_APPROVED_SOURCE --prebuild-fixture
      - name: Set up Node for Vite and the native driver
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Preflight dependencies and native driver syntax
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          if ('x86_64-pc-windows-msvc' -cnotin @(rustup target list --installed)) {
            throw 'The hosted image must supply the x64 Windows MSVC toolchain.'
          }
          npm ci --prefix frontend --no-audit --no-fund
          python -m pip install -r backend/requirements.txt
          node --check frontend/e2e/p4-71-native-webview-qa.mjs
          node --check frontend/e2e/p4-n12-native-cases.mjs
          node --test frontend/e2e/p4-n12-native-cases.test.mjs
      - name: Stage one unpackaged app and preserve the binary digest
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          python -B -m qa.p4_research.n12_app_build stage --source $env:PILOTODIN_N12_APPROVED_SOURCE
          $staged = Join-Path $env:RUNNER_TEMP "pilotodin-n12-build-$env:GITHUB_RUN_ID/build.json"
          $receipt = Get-Content -LiteralPath $staged -Raw | ConvertFrom-Json
          if ($receipt.source_sha -cne $env:PILOTODIN_N12_APPROVED_SOURCE -or
              $receipt.executable_sha256 -cnotmatch '^[0-9a-f]{64}$') {
            throw 'No usable provenance receipt was produced by staging.'
          }
          "PILOTODIN_N12_EXE_SHA256=$($receipt.executable_sha256)" >> $env:GITHUB_ENV
      - name: Provision reviewed Sysmon and capture the app journey
        shell: pwsh
        run: |
          ./qa/p4_native/Invoke_P4_N12_Live_Calibration.ps1 -WithEtw -AppJourney `
            -SourceSha $env:PILOTODIN_N12_APPROVED_SOURCE -ExecutableSha256 $env:PILOTODIN_N12_EXE_SHA256
