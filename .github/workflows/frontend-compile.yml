name: Build E - Frontend Compilation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-frontend:
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out application source
        uses: actions/checkout@v5
      - name: Require existing checked-in lock before setup
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath 'package-lock.json' -PathType Leaf)) { throw 'Missing package-lock.json; no setup' }
      - name: Install Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install exact locked dependencies
        shell: pwsh
        run: |
          node scripts/verify-npm-lock.mjs
          if ($LASTEXITCODE -ne 0) { throw 'C5 npm preflight refused' }
          npm ci --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'npm ci failed' }
          git diff --exit-code -- package-lock.json package.json
          if ($LASTEXITCODE -ne 0) { throw 'Dependency inputs changed' }
      - name: Run frontend behavioral tests
        shell: pwsh
        run: npm run test:workspace
      - name: Compile TypeScript and bundle React frontend
        shell: pwsh
        run: npm run build
      - name: Verify production asset output
        shell: pwsh
        run: |
          if (-not (Test-Path 'dist/index.html')) { throw 'Vite did not produce dist/index.html' }
          $bundles = @(Get-ChildItem -Path dist/assets -Recurse -File -Filter '*.js' -ErrorAction Stop)
          if ($bundles.Count -eq 0) { throw 'Vite produced no JavaScript bundle' }
          Write-Host "Verified $($bundles.Count) JavaScript asset(s)."
      - name: Publish frontend proof and existing lockfile
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: pilotodin-frontend-verification-${{ github.run_number }}
          path: |
            frontend/package-lock.json
            frontend/dist/
          if-no-files-found: warn
          retention-days: 14
