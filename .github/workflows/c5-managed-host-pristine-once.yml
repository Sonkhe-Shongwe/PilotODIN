          echo 'C5_MHTA_ACTIVATION_MARKER_VERIFIED'
      - name: Checkout exact detached source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: '7a5bebdca47f90f067ad6ed9591719cbbb8d5d11'
          persist-credentials: false
          fetch-depth: 1
          path: candidate
      - name: Verify source and run generated tests
        shell: bash
        working-directory: candidate
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$(git rev-parse HEAD)" = '7a5bebdca47f90f067ad6ed9591719cbbb8d5d11'
          test "$(git rev-parse 'HEAD^{tree}')" = '9c0901a890e278b725b89dd5842024c2e861a2d1'
          test "$(git rev-parse 'HEAD:qa/c5_managed_dev/c5_managed_host_assurance.py')" = '0e950a8681034ff23fd5d226ee48d3b3d8069c37'
          test "$(git rev-parse 'HEAD:qa/c5_managed_dev/c5_managed_host_once.py')" = '77f42c65cee06910b821066b38742e09928701c5'
          test "$(git rev-parse 'HEAD:qa/c5_managed_dev/test_c5_managed_host_assurance.py')" = 'd538d6825e9505f98e5fe351fefb90dc67aeef5d'
          test "$(git rev-parse 'HEAD:qa/c5_managed_dev/test_c5_managed_host_once.py')" = 'adf458c115d777732c4a81522697673a091f96a3'
          test "$(git rev-parse 'HEAD:qa/c5_managed_dev/test_c5_managed_host_bounded.py')" = '7fc10b303a5a25626f7e3c7e2a590c3e11d61642'
          test "$(git rev-parse 'HEAD:qa/c5_managed_dev/test_c5_managed_host_startup.py')" = '444c99992a1ee81b71c0513a5f4ea03c962b2c0b'
          test "$(git rev-parse 'HEAD:qa/c5_managed_dev/c5_systemd_fixture_launcher.py')" = 'bf69e79fab3c1a94f7a88af78cd8ac63860d71cf'
          test "$(git rev-parse 'HEAD:qa/c5_managed_dev/test_c5_systemd_fixture_launcher.py')" = '3e4e0eba1248d139a9923b9ba78538b9377ee464'
          test "$(git rev-parse 'HEAD:qa/c5_managed_dev/test_c5_systemd_observe_generated.py')" = 'b7726ea2c979b0399e6fa9de3f9162d1c352c855'
          test "$(git rev-parse 'HEAD:qa/c5_managed_dev/c5_managed_host_assurance_20261128.PROPOSED.json')" = '10b4fd8909f9124708c9f16e64bde47157e3e781'
          test "$(git rev-parse 'HEAD:qa/c5_managed_dev/test_c5_systemd_pristine_generated.py')" = 'f2f81b8de78e877ce559e0dd4a565d0861539892'
          git diff --quiet HEAD --
          test -z "$(git status --porcelain)"
          test "$(id -u)" != 0
          test "$(uname -m)" = x86_64
          test "${ImageOS:-}" = ubuntu24
          test "${RUNNER_ENVIRONMENT:-}" = github-hosted
          test "$(readlink -f /usr/bin/python3.12)" = /usr/bin/python3.12
          /usr/bin/python3.12 -I -S -B -c 'import sys; assert sys.implementation.name == "cpython" and sys.version_info[:3] == (3,12,3)'
          /usr/bin/python3.12 -I -S -B - <<'PY'
          import sys, unittest
          from pathlib import Path
          sys.path.insert(0, str(Path.cwd()))
          names = ['qa.c5_managed_dev.' + x for x in (
              'test_c5_managed_host_assurance','test_c5_managed_host_once',
              'test_c5_managed_host_bounded','test_c5_managed_host_startup',
              'test_c5_systemd_fixture_launcher','test_c5_systemd_observe_generated',
              'test_c5_systemd_pristine_generated')]
          suite = unittest.defaultTestLoader.loadTestsFromNames(names)
          if suite.countTestCases() != 31:
              raise SystemExit('C5_MHTA_TEST_COUNT')
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          if not result.wasSuccessful() or result.skipped or result.expectedFailures or result.unexpectedSuccesses:
              raise SystemExit('C5_MHTA_GENERATED_TESTS_REFUSED')
          PY
          git diff --quiet HEAD --
          test -z "$(git status --porcelain)"
