        working-directory: activation
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse 'HEAD:qa/c5_managed_dev/APPROVAL_MANAGED_HOST_PRISTINE_20261128.txt')" = 'efed64326e9bea58997219cb660a0616120bf5a4'
          test "$(cat 'qa/c5_managed_dev/APPROVAL_MANAGED_HOST_PRISTINE_20261128.txt')" = 'C5-MHTA-PRISTINE-ISOLATED-FIXTURE-ONCE-20261128'
