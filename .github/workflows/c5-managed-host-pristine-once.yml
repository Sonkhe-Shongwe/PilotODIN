        run: |
          set -euo pipefail
          /usr/bin/python3.12 -I -S -B - <<'PY'
          import hashlib, json
          from pathlib import Path
          try:
              path = Path('qa/c5_managed_dev/c5_managed_host_once.py').resolve(strict=True)
              with path.open('rb') as f:
