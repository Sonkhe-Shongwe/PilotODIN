name: C5 wheel archive synthetic offline review
on:
  push:
    branches: [feature/live-dev-workspace-20261023]
    paths:
      - .github/workflows/c5-wheel-archive-review.yml
      - qa/c5_wheel_metadata/wheel_archive_inspector.py
      - qa/c5_wheel_metadata/test_wheel_archive_inspector.py
permissions:
  contents: read
jobs:
  synthetic-wheel:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Interpreter observation and inert wheel fixtures
        shell: bash
        run: |
          python --version
          python -I -B qa/c5_wheel_metadata/test_wheel_archive_inspector.py
      - name: Require direct acquisition refusal
        shell: bash
        run: |
          set +e
          result=$(python -I -B qa/c5_wheel_metadata/wheel_archive_inspector.py --collect 2>&1)
          code=$?
          set -e
          printf '%s\n' "$result"
          test "$code" = 1
          test "$result" = 'OFFLINE_LIBRARY_ONLY: no acquisition or arbitrary wheel CLI'
