name: P4 N12 Live Collector Calibration

on:
  push:
    branches:
      - feature/live-dev-workspace-20261023
    paths:
      - .github/workflows/p4-n12-live-calibration.yml

permissions:
  contents: read

jobs:
  calibration:
    if: ${{ false }} # One-time provisioning approval consumed by run 43452047885
    runs-on: windows-2022
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout calibration source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Verify this is the approved one-time run
        shell: pwsh
        run: |
          $parent = git rev-parse HEAD^
          if ($LASTEXITCODE -ne 0 -or $parent -ne '20c83bcfb5f9d5836aa6fa3b8026f6ed1aa899b5' -or
              $env:GITHUB_RUN_ATTEMPT -ne '1') {
            throw 'The approved collector calibration is for one run from the reviewed parent.'
          }
          $changed = @(git diff-tree --no-commit-id --name-only -r HEAD)
          if ($LASTEXITCODE -ne 0 -or ($changed -join '|') -ne
              '.github/workflows/p4-n12-live-calibration.yml|qa/p4_native/Invoke_P4_N12_Live_Calibration.ps1') {
            throw 'The approved launch changes only the calibration workflow and script.'
          }
      - name: Use Python for the generated fixture
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - name: Run and reduce the live capture
        shell: pwsh
        run: ./qa/p4_native/Invoke_P4_N12_Live_Calibration.ps1
