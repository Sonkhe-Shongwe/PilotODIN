name: P1 Isolated Backend Source Recovery

# Trusted feature-branch commits only. Never run jobs from public fork PRs.
on:
  push:
    branches:
      - feature/live-dev-workspace-20261023
    paths:
      - .github/workflows/p1-isolated-backend.yml
      - backend/main.py
      - backend/resource_admission.py
      - backend/resource_routes.py
      - backend/resource_http.py
      - backend/resource_upload.py
      - backend/resource_training.py
      - backend/resource_training_store.py
      - backend/resource_autonomy.py
      - backend/resource_host.py
      - backend/resource_session.py
      - backend/export_transfer.py
      - tests/test_c1_product_integration.py
      - tests/test_p2_pdf_export_route_integration.py
      - tests/test_c1_resource_host.py
      - backend/autonomy.py
      - tests/test_c1_resource_autonomy.py
      - tests/test_build_e_autonomous_investigations.py
      - tests/test_c1_resource_training_store.py
      - tests/test_c1_resource_training.py
      - tests/test_c1_resource_upload.py
      - tests/test_c1_resource_http.py
      - tests/test_c1_resource_admission.py
      - backend/quality.py
      - backend/requirements.txt
      - backend/requirements-test.txt
      - tests/test_p1_source_location_recovery.py
      - tests/test_p1_relink_original_source.py
      - tools/p1_relink_original_source.py
      - tests/test_p1_import_recovery.py
      - tests/test_p1_upload_atomic_staging.py
      - tests/test_p1_real_api_failed_switch.py
      - tests/fixture_http.py
      - tests/test_p1_resource_policy.py
      - tests/test_p1_resource_admission.py

permissions:
  contents: read

concurrency:
  group: pilotodin-p1-backend-feature-20261023
  cancel-in-progress: true

jobs:
  source-recovery:
    name: Temporary-store source and import recovery
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CI: "true"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout without stored credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Set up Python 3.11
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - name: Install existing test dependencies
        run: python -m pip install -r backend/requirements-test.txt
      - name: Compile backend modules
        run: python -m compileall -q backend
      - name: Run isolated missing-source and import safety regression
        env:
          PILOTODIN_HOME: ${{ runner.temp }}/pilotodin-p1-recovery-${{ github.run_id }}
        run: >-
          python -m pytest -q
          tests/test_p1_source_location_recovery.py
          tests/test_p1_relink_original_source.py
          tests/test_p1_import_recovery.py
          tests/test_p1_upload_atomic_staging.py
          tests/test_p1_real_api_failed_switch.py
          tests/test_p1_resource_policy.py
          tests/test_p1_resource_admission.py

      - name: Exercise C1 pure coordinator and exact route inventory
        run: python -m pytest -q tests/test_c1_resource_admission.py tests/test_c1_resource_http.py tests/test_c1_resource_upload.py tests/test_c1_resource_training.py

      - name: Exercise C1 durable training and actual ASGI background ownership
        env:
          PILOTODIN_HOME: ${{ runner.temp }}/pilotodin-c1-training-${{ github.run_id }}
        run: python -m pytest -q tests/test_c1_resource_training_store.py

      - name: Exercise staged C1 autonomy and existing read-only investigation regression
        env:
          PILOTODIN_HOME: ${{ runner.temp }}/pilotodin-c1-autonomy-${{ github.run_id }}
        run: python -m pytest -q tests/test_c1_resource_autonomy.py tests/test_build_e_autonomous_investigations.py

      - name: Exercise staged C1 owned host protocol without native processes
        run: python -m pytest -q tests/test_c1_resource_host.py

      - name: Exercise actual product route composition with inert inference and synthetic data
        env:
          PILOTODIN_HOME: ${{ runner.temp }}/pilotodin-c1-product-${{ github.run_id }}
        run: python -m pytest -q tests/test_c1_product_integration.py

      - name: Exercise nine isolated authenticated P2 PDF export route cases
        run: |
          set -euo pipefail
          home="$(mktemp -d)"
          trap 'rm -rf -- "$home"' EXIT
          printf '%s\n' SYNTHETIC_TEMP_ONLY > "$home/.pilotodin-p2-export-route-devqa"
          PILOTODIN_HOME="$home" PILOTODIN_P2_EXPORT_ROUTE_DEVQA=1 python -B - <<'PY'
          import unittest
          suite = unittest.defaultTestLoader.loadTestsFromName("tests.test_p2_pdf_export_route_integration")
          assert suite.countTestCases() == 9
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          assert result.wasSuccessful() and result.testsRun == 9 and not result.skipped
          PY
