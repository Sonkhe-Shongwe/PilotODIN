name: P1 Isolated Backend Source Recovery

# Trusted feature-branch commits only. Never run jobs from public fork PRs.
on:
  push:
    branches:
      - feature/live-dev-workspace-20261023
    paths:
      - .github/workflows/p1-isolated-backend.yml
      - backend/main.py
      - backend/quality.py
      - backend/requirements.txt
      - backend/requirements-test.txt
      - tests/test_p1_source_location_recovery.py
      - tests/test_p1_relink_original_source.py
      - tools/p1_relink_original_source.py
      - tests/test_p1_import_recovery.py
      - tests/test_p1_upload_atomic_staging.py
      - tests/test_p1_real_api_failed_switch.py

permissions:
  contents: read

concurrency:
  group: pilotodin-p1-backend-feature-20261023
  cancel-in-progress: true

jobs:
  source-recovery:
    name: Temporary-store source and import recovery
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CI: "true"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout without stored credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Set up Python 3.11
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - name: Install existing test dependencies
        run: python -m pip install -r backend/requirements-test.txt
      - name: Compile backend modules
        run: python -m compileall -q backend
      - name: Run isolated missing-source and import safety regression
        env:
          PILOTODIN_HOME: ${{ runner.temp }}/pilotodin-p1-recovery-${{ github.run_id }}
        run: >-
          python -m pytest -q
          tests/test_p1_source_location_recovery.py
          tests/test_p1_relink_original_source.py
          tests/test_p1_import_recovery.py
          tests/test_p1_upload_atomic_staging.py
          tests/test_p1_real_api_failed_switch.py
