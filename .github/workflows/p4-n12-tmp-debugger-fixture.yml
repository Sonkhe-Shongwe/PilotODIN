name: P4 N12 generated launch TMP fixture

on:
  push:
    branches:
      - feature/live-dev-workspace-20261023
    paths:
      - qa/p4_research/N12_TMP_DEBUGGER_FIXTURE_APPROVAL.txt

permissions:
  contents: read

jobs:
  tmp-fixture:
    if: ${{ false }} # Awaiting one source-pinned generated fixture approval.
    runs-on: windows-2025
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Verify the one-use approval and run one generated child
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $marker = 'qa/p4_research/N12_TMP_DEBUGGER_FIXTURE_APPROVAL.txt'
          $workflow = '.github/workflows/p4-n12-tmp-debugger-fixture.yml'
          if ($env:GITHUB_EVENT_NAME -cne 'push' -or $env:GITHUB_RUN_ATTEMPT -cne '1' -or
              $env:GITHUB_REF_NAME -cne 'feature/live-dev-workspace-20261023' -or
              $env:RUNNER_ENVIRONMENT -cne 'github-hosted' -or $env:RUNNER_OS -cne 'Windows' -or
              (git rev-parse HEAD) -cne $env:GITHUB_SHA) {
            throw 'Expected the first approved hosted Windows push.'
          }
          $approval = @(Get-Content -LiteralPath $marker)
          if ($approval.Count -ne 2 -or $approval[0] -cnotmatch '^reviewed_source=([0-9a-f]{40})$' -or
              $approval[1] -cne 'scope=n12-one-tmp-debugger-fixture') {
            throw 'A fresh source-pinned TMP fixture approval is required.'
          }
          $source = $Matches[1]
          $parents = (git rev-list --parents -n 1 HEAD) -split ' '
          $changed = @(git diff --name-only $source HEAD)
          $added = @(git diff --name-only --diff-filter=A $source HEAD -- $marker)
          if ($parents.Count -ne 2 -or $parents[1] -cne $source -or
              $changed.Count -ne 2 -or $workflow -cnotin $changed -or $marker -cnotin $changed -or
              $added.Count -ne 1 -or $added[0] -cne $marker) {
            throw 'The launch must be a direct child of the reviewed source.'
          }
          git checkout --detach $source
          $env:PILOTODIN_N12_TMP_DEBUGGER_SOURCE = $source
          $env:PILOTODIN_N12_TMP_DEBUGGER_CONSENT = 'I_APPROVE_ONE_N12_TMP_DEBUGGER_FIXTURE'
          python -B -m unittest tests.test_p4_n12_tmp_debugger_fixture
          python -B -m qa.p4_research.n12_tmp_debugger_fixture
