name: P1 Acceptance Macro Safety

on:
  push:
    branches:
      - feature/live-dev-workspace-20261023
    paths:
      - .github/workflows/p1-acceptance-macro-safety.yml
      - tools/Run_P1_Acceptance_Macro.py
      - tools/test_p1_acceptance_macro.py
      - Run_PilotODIN_P1_Acceptance_Macro.bat
      - docs/P1_MACRO_NATIVE_CHECKLIST.md
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-macro-source-safety:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - name: Checkout without retaining credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Python 3.11
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - name: Verify macro safety contracts only
        run: python -m unittest discover -s tools -p test_p1_acceptance_macro.py -v
      - name: Verify command-line help does not execute tests
        run: python tools/Run_P1_Acceptance_Macro.py --help
