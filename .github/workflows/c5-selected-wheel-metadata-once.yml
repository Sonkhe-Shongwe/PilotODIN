name: C5 selected-wheel metadata one use

on:
  push:
    branches: [feature/live-dev-workspace-20261023]
    paths:
      - .github/workflows/c5-selected-wheel-metadata-once.yml
      - qa/c5_wheel_metadata/collect.py
      - qa/c5_wheel_metadata/APPROVAL_20261125.txt

permissions:
  contents: read

jobs:
  offline-preflight:
    if: ${{ github.run_attempt == 1 && github.event.head_commit.message != 'C5-SELECTED-WHEEL-METADATA-ONCE-20261125 activate' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - run: python3 -I -B qa/c5_wheel_metadata/collect.py --self-test
  collect-once:
    if: ${{ false }} # Not armed; owner approval recorded, offline preflight first.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - run: python3 -I -B qa/c5_wheel_metadata/collect.py --self-test
      - name: Collect only reviewed hash-advertised metadata
        env:
          C5_APPROVED_ONCE: C5-SELECTED-WHEEL-METADATA-ONCE-20261125
        run: python3 -I -B qa/c5_wheel_metadata/collect.py --collect
