name: Windows Desktop Preview

on:
  workflow_dispatch:
  push:
    tags:
      - 'pilotodin-desktop-*'

permissions:
  contents: read

jobs:
  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - name: Check out lightweight source
        uses: actions/checkout@v4
      - name: Python build runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Node build runtime
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rust MSVC toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Cache Rust build outputs
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri -> target
      - name: Verify existing and desktop backend tests
        shell: pwsh
        run: |
          python -m pip install -r backend/requirements-test.txt
          python -m pytest -q
      - name: Build unsigned Windows installer
        shell: pwsh
        run: ./desktop/Build_Windows_Installer.ps1
      - name: Upload development installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: PilotODIN-Desktop-Windows-Unsigned-Preview
          path: frontend/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
