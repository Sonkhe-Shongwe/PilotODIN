name: P4 R03 Windows Qwen worker profile

# One hosted profiling run approved on 14 November 2026.
on:
  push:
    branches:
      - feature/live-dev-workspace-20261023
    paths:
      - .github/workflows/p4-r03-qwen-worker-profile.yml

permissions:
  contents: read

jobs:
  profile:
    if: >-
      github.run_attempt == '1' &&
      github.event.head_commit.message == 'test(p4): run approved Windows Qwen memory profile'
    runs-on: windows-2022
    timeout-minutes: 15
    env:
      PROFILE_SOURCE: 857454ab6aaf406ec758929ea713a5f68abea910
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Verify profiling source and runner memory
        shell: pwsh
        run: |
          $parent = (git rev-parse HEAD^).Trim()
          if ($parent -ne $env:PROFILE_SOURCE) { throw 'Unexpected profiling source' }
          git diff --exit-code $env:PROFILE_SOURCE HEAD -- desktop
          if ($LASTEXITCODE -ne 0) { throw 'Profiling source differs from approved source' }
          $hostOs = Get-CimInstance Win32_OperatingSystem
          Write-Host ('Hosted runner RAM: {0:N2} GiB visible, {1:N2} GiB free at preflight' -f ($hostOs.TotalVisibleMemorySize / 1MB), ($hostOs.FreePhysicalMemory / 1MB))
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Stage the pinned Qwen model and CPU runtime
        shell: pwsh
        run: ./desktop/Stage_Pinned_Offline_AI.ps1
      - name: Measure model load and one authenticated localhost completion
        shell: pwsh
        run: python desktop/verify_live_bundled_inference.py --memory-profile
