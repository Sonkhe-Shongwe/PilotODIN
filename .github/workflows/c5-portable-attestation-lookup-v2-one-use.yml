name: C5 portable attestation lookup v2 one use
on:
  push:
    branches: [qa/c5-portable-attestation-lookup-v2-20261126]
    paths: ['.github/workflows/c5-portable-attestation-lookup-v2-one-use.yml']
permissions: {}
jobs:
  metadata-only:
    if: ${{ github.event.before == '64bb85676f50ec507e8d0614f1cf9293f04c9291' && !github.event.created && github.run_attempt == 1 }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Two public digest lookups only
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          export PATH=/usr/bin:/bin LC_ALL=C
          [[ "$GITHUB_RUN_ATTEMPT" == 1 && "$GITHUB_REF" == refs/heads/qa/c5-portable-attestation-lookup-v2-20261126 ]]
          scratch="$(mktemp -d "$RUNNER_TEMP/c5-attestation.XXXXXXXX")"
          trap 'rm -rf -- "$scratch"' EXIT
          cd "$scratch"
          for t in curl jq sha256sum head wc mkfifo grep awk tr; do
            [[ -x "/usr/bin/$t" ]] || { echo "REFUSED missing reviewed tool"; exit 1; }
          done
          read -r _ ver _ < <(/usr/bin/curl --version)
          [[ "$ver" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]
          (( BASH_REMATCH[1] > 8 || (BASH_REMATCH[1] == 8 && BASH_REMATCH[2] >= 4) )) || { echo 'REFUSED curl streaming cap unavailable'; exit 1; }
          echo "LOOKUP_BOOTSTRAP curl=$ver jq=$(/usr/bin/jq --version)"
          echo "LOOKUP_SOURCE=$GITHUB_SHA"
          lookup() {
            local label="$1" digest="$2" url="$3" rc=0 hpid metrics n h hash code downloaded count
            mkfifo headers.pipe
            head -c 65536 <headers.pipe >headers.txt & hpid=$!
            metrics="$(env -i PATH=/usr/bin:/bin LC_ALL=C HOME="$scratch" /usr/bin/curl -q --silent --noproxy '*' --proxy '' --proto '=https' --proto-redir '=https' --max-redirs 0 --retry 0 --http1.1 --connect-timeout 10 --max-time 30 --max-filesize 1048576 --header 'Accept: application/vnd.github+json' --header 'X-GitHub-Api-Version: 2026-03-10' --header 'Accept-Encoding: identity' --output body.json --dump-header headers.pipe --write-out '%{http_code} %{size_download}' "$url" 2>/dev/null)" || rc=$?
            # On early transport failure curl may not open the FIFO. Terminate reader, never hang.
            if (( rc != 0 )); then kill "$hpid" 2>/dev/null || true; wait "$hpid" 2>/dev/null || true; else wait "$hpid"; fi
            rm -f headers.pipe
            n=0; [[ ! -f body.json ]] || n="$(wc -c <body.json)"
            h="$(wc -c <headers.txt)"
            read -r code downloaded <<<"$metrics"
            [[ "$code" =~ ^[0-9]{3}$ && "$downloaded" =~ ^[0-9]+$ ]] || { echo "LOOKUP_REFUSED $label transport"; return 1; }
            echo "LOOKUP_TRANSFER $label status=$code bytes=$n header_bytes=$h curl_exit=$rc"
            (( rc == 0 && n > 0 && n <= 1048576 && h < 65536 && downloaded == n )) || return 1
            # Reject pagination, redirects, compressed content and ambiguous framing.
            if grep -Eiq '^(link|location):' headers.txt; then echo "LOOKUP_REFUSED $label redirect_or_pagination"; return 1; fi
            if grep -Ei '^content-encoding:' headers.txt | grep -Eivq '^content-encoding:[[:space:]]*identity[[:space:]]*$'; then return 1; fi
            [[ "$(grep -Eic "^HTTP/1\.[01] $code([[:space:]]|$)" headers.txt)" == 1 ]]
            local lengths transfers
            lengths="$(grep -Ei '^content-length:' headers.txt | tr -d '\r' | awk '{print $2}' || true)"
            transfers="$(grep -Ei '^transfer-encoding:' headers.txt | tr -d '\r' | awk '{print tolower($2)}' || true)"
            if [[ -n "$lengths" ]]; then [[ "$lengths" =~ ^[0-9]+$ && "$lengths" == "$n" && -z "$transfers" ]]; else [[ "$transfers" == chunked ]]; fi
            for key in x-ratelimit-limit x-ratelimit-remaining x-ratelimit-used x-ratelimit-reset retry-after; do
              v="$(awk -v k="$key" 'tolower($1)==k":" { sub(/\r$/,""); sub(/^[^:]+:[ \t]*/,""); print }' headers.txt)"
              if [[ "$v" =~ ^[0-9]{1,12}$ ]]; then echo "LOOKUP_HEADER $label $key=$v"; elif [[ -z "$v" ]]; then echo "LOOKUP_HEADER $label $key=ABSENT"; else echo "LOOKUP_HEADER $label $key=OTHER_OR_AMBIGUOUS"; fi
            done
            v="$(awk 'tolower($1)=="x-ratelimit-resource:" { sub(/\r$/,""); sub(/^[^:]+:[ \t]*/,""); print }' headers.txt)"
            case "$v" in core|search|graphql|integration_manifest|code_search|dependency_snapshots|scim|source_import|code_scanning_upload|actions_runner_registration) echo "LOOKUP_HEADER $label x-ratelimit-resource=$v";; "") echo "LOOKUP_HEADER $label x-ratelimit-resource=ABSENT";; *) echo "LOOKUP_HEADER $label x-ratelimit-resource=OTHER";; esac
            # Never print arbitrary upstream text, credentials, bundle URLs, or response JSON.
            # Classify the exact message via fixed output labels, even on HTTP error.
            jq -ers '
              if length!=1 or (.[0]|type)!="object" then error("shape") else .[0] end |
              if (.message|type)=="string" then
                .message|ascii_downcase |
                if test("secondary rate limit|abuse detection") then "SECONDARY_RATE_LIMIT"
                elif test("api rate limit exceeded|primary rate limit|rate limit exceeded") then "PRIMARY_RATE_LIMIT_MESSAGE"
                elif test("resource not accessible by integration") then "RESOURCE_NOT_ACCESSIBLE_BY_INTEGRATION"
                elif test("resource not accessible by personal access token") then "RESOURCE_NOT_ACCESSIBLE_BY_TOKEN"
                elif test("requires authentication|authentication required|must be authenticated") then "AUTHENTICATION_REQUIRED"
                elif test("bad credentials") then "BAD_CREDENTIALS"
                elif test("api version|unsupported version") then "API_VERSION_ERROR"
                elif test("not found") then "NOT_FOUND"
                elif test("forbidden") then "GENERIC_FORBIDDEN"
                else "OTHER_MESSAGE_REDACTED" end
              elif (.attestations|type)=="array" then "ATTESTATION_LIST_PRESENT"
              else "NO_RECOGNISED_MESSAGE" end' body.json >classification.txt 2>/dev/null || { echo "LOOKUP_CLASS $label INVALID_JSON_OR_SHAPE"; exit 1; }
            echo "LOOKUP_CLASS $label $(cat classification.txt)"
            hash="$(sha256sum body.json | awk '{print $1}')"
            echo "LOOKUP_BODY $label sha256=$hash requested_subject=$digest"
            [[ "$code" == 200 ]] || { echo "LOOKUP_REFUSED $label HTTP_$code"; return 1; }
            count="$(jq -ers 'if length==1 and (.[0]|type)=="object" and (.[0].attestations|type)=="array" then .[0].attestations|length else error("shape") end' body.json 2>/dev/null)" || return 1
            echo "LOOKUP_COUNT $label count=$count"
            [[ "$count" == 1 ]] || { echo "LOOKUP_REFUSED $label missing_or_ambiguous"; return 1; }
            jq -e --arg d "$digest" --arg label "$label" '
              .attestations[0] as $a |
              if ($a|type)!="object" or $a.repository_id!=162334160 then error("repository") else
                ($a.bundle_url // null) as $u |
                ($a.bundle // null) as $b |
                if $u==null and $b==null then error("no bundle") else
                (if $u==null then null else
                   if ($u|type)!="string" or ($u|length)>8192 then error("URL") else
                    ($u|capture("^https://(?<host>[a-z0-9.-]{1,253})/attestations/162334160/(?<year>[0-9]{4})/(?<month>[0-9]{2})/(?<day>[0-9]{2})/(?<id>[0-9]{1,18})\\.json\\.sn(?:\\?[^\\r\\n#]*)?$")) |
                    if (.host|length)>253 or (.host|test("^[a-z0-9]+(?:[.-][a-z0-9]+)*$")|not) then error("host") else . end
                   end end) as $location |
                (if $b==null then false else
                  if ($b|type)!="object" then error("bundle shape") else
                  ($b.dsseEnvelope.payload|@base64d|fromjson) as $p |
                  if ($p.subject|type)!="array" or ([$p.subject[]|select(.digest.sha256==$d)]|length)!=1 then error("subject") else true end end end) as $inline |
                {profile:$label,repository_id:$a.repository_id,initiator:(if $a.initiator=="user" or $a.initiator=="github-actions" or $a.initiator=="github_actions" then $a.initiator else "OTHER_OR_ABSENT" end),attestation_id:(if ($a.id|type)=="number" and $a.id>0 and $a.id<=9007199254740991 and ($a.id|floor)==$a.id then $a.id else null end),bundle_location:$location,inline_subject_match:$inline,subject_binding:(if $inline then "INLINE_UNVERIFIED_MATCH" else "DIGEST_QUERY_ONLY_PENDING_SIGNATURE" end),cryptographic_verification:false}
                end end' body.json >safe.json 2>/dev/null || { echo "LOOKUP_REFUSED $label invalid_or_unreviewed_bundle_shape"; return 1; }
            # jq capture can emit no result; require a single safe object.
            jq -ecs 'if length==1 and (.[0]|type)=="object" then .[0] else error("no safe row") end' safe.json 2>/dev/null || return 1
            if jq -e '.inline_subject_match' safe.json >/dev/null; then
              echo "LOOKUP_INLINE_HASH $label $(jq -cS '.attestations[0].bundle' body.json | sha256sum | awk '{print $1}')"
            fi
            rm -f body.json headers.txt safe.json
          }
          lookup windows 3e4a35e3c238e5090d36bf95c041d9052bc82d6e298cb912ba7f70f6c66cf81a 'https://api.github.com/repos/astral-sh/python-build-standalone/attestations/sha256:3e4a35e3c238e5090d36bf95c041d9052bc82d6e298cb912ba7f70f6c66cf81a?per_page=10&predicate_type=provenance'
          lookup linux ef0764e884b5e123692281b91bf388f8ebfd0afb41d6a212bb4f2779e51abf0e 'https://api.github.com/repos/astral-sh/python-build-standalone/attestations/sha256:ef0764e884b5e123692281b91bf388f8ebfd0afb41d6a212bb4f2779e51abf0e?per_page=10&predicate_type=provenance'
          echo 'C5_ATTESTATION_METADATA_LOOKUP_PASS no_bundle_follow no_archive no_interpreter'
