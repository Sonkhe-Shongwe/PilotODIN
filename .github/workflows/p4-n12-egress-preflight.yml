name: P4 N12 Windows egress preflight

on:
  push:
    branches:
      - feature/live-dev-workspace-20261023
    paths:
      - qa/p4_research/N12_EGRESS_PREFLIGHT_APPROVAL.txt

permissions:
  contents: read

jobs:
  preflight:
    if: ${{ false }} # Enable only for a freshly approved source-pinned fixture.
    runs-on: windows-2022
    timeout-minutes: 5
    steps:
      - name: Checkout the proposed launch commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Verify one-use approval and run the Windows TCP fixture
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $marker = 'qa/p4_research/N12_EGRESS_PREFLIGHT_APPROVAL.txt'
          $workflow = '.github/workflows/p4-n12-egress-preflight.yml'
          if ($env:GITHUB_EVENT_NAME -cne 'push' -or $env:GITHUB_RUN_ATTEMPT -cne '1' -or
              $env:GITHUB_REF_NAME -cne 'feature/live-dev-workspace-20261023' -or
              $env:RUNNER_ENVIRONMENT -cne 'github-hosted' -or $env:RUNNER_OS -cne 'Windows' -or
              (git rev-parse HEAD) -cne $env:GITHUB_SHA) {
            throw 'The fixture requires the first run of an approved hosted Windows push.'
          }
          $approval = @(Get-Content -LiteralPath $marker)
          if ($approval.Count -ne 2 -or $approval[0] -cnotmatch '^reviewed_source=([0-9a-f]{40})$' -or
              $approval[1] -cne 'scope=n12-one-windows-egress-preflight') {
            throw 'A source-pinned egress preflight approval is required.'
          }
          $source = $Matches[1]
          $parents = (git rev-list --parents -n 1 HEAD) -split ' '
          $changed = @(git diff --name-only $source HEAD)
          $added = @(git diff --name-only --diff-filter=A $source HEAD -- $marker)
          if ($parents.Count -ne 2 -or $parents[1] -cne $source -or $changed.Count -ne 2 -or
              $workflow -cnotin $changed -or $marker -cnotin $changed -or $added.Count -ne 1) {
            throw 'The launch must directly follow the reviewed source and add only the approval and activation.'
          }
          git checkout --detach $source
          $env:PILOTODIN_N12_EGRESS_SOURCE = $source
          $env:PILOTODIN_N12_EGRESS_CONSENT = 'I_APPROVE_ONE_N12_EGRESS_PREFLIGHT'
          python -B -m qa.p4_research.n12_egress --source $source
