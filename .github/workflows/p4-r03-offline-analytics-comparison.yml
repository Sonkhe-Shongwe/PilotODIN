name: P4 R03 offline analytics comparison

# One hosted comparison approved on 14 November 2026.
on:
  push:
    branches:
      - feature/live-dev-workspace-20261023
    paths:
      - .github/workflows/p4-r03-offline-analytics-comparison.yml

permissions:
  contents: read

jobs:
  compare:
    if: >-
      github.run_attempt == '1' &&
      github.event.head_commit.message == 'test(p4): run approved hosted offline analytics comparison'
    runs-on: windows-2022
    timeout-minutes: 25
    env:
      EVALUATION_SOURCE: 238d8c74cd80ff656cc303f484c1392904270c67
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Verify comparison source and runner memory
        shell: pwsh
        run: |
          $parent = (git rev-parse HEAD^).Trim()
          if ($parent -ne $env:EVALUATION_SOURCE) { throw 'Unexpected comparison source' }
          git diff --exit-code $env:EVALUATION_SOURCE HEAD -- desktop
          if ($LASTEXITCODE -ne 0) { throw 'Harness differs from the approved source' }
          $hostOs = Get-CimInstance Win32_OperatingSystem
          Write-Host ('Hosted runner RAM: {0:N2} GiB visible, {1:N2} GiB free at preflight' -f ($hostOs.TotalVisibleMemorySize / 1MB), ($hostOs.FreePhysicalMemory / 1MB))
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Stage the pinned baseline and CPU runtime
        shell: pwsh
        run: ./desktop/Stage_Pinned_Offline_AI.ps1
      - name: Download and verify both pinned candidate files
        id: candidates
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $specs = python -c "import json, sys; sys.path.insert(0, 'desktop'); from offline_analytics_cases import CANDIDATES; print(json.dumps(CANDIDATES))"
          if ($LASTEXITCODE -ne 0) { throw 'Could not read pinned candidate specifications' }
          $models = $specs | ConvertFrom-Json -AsHashtable
          if ($models.Count -ne 2) { throw 'Expected exactly two candidate models' }
          foreach ($entry in $models.GetEnumerator()) {
            $url, $size, $digest = $entry.Value
            $file = Join-Path $env:RUNNER_TEMP ($entry.Key + '.gguf')
            Invoke-WebRequest -Uri $url -OutFile $file -MaximumRedirection 10
            if ((Get-Item -LiteralPath $file).Length -ne $size -or
                (Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash -ine $digest) {
              throw "Candidate integrity failed: $($entry.Key)"
            }
            Write-Host "Verified $($entry.Key): $size bytes"
          }
      - name: Measure bundled Qwen3 1.7B
        shell: pwsh
        run: python desktop/verify_live_bundled_inference.py --analytics-eval
      - name: Measure Qwen3 0.6B
        if: ${{ !cancelled() && steps.candidates.outcome == 'success' }}
        shell: pwsh
        run: |
          $file = Join-Path $env:RUNNER_TEMP 'qwen3-0.6b-q4-k-m.gguf'
          python desktop/verify_live_bundled_inference.py --analytics-eval --candidate qwen3-0.6b-q4-k-m --candidate-file $file
      - name: Measure SmolLM2 360M
        if: ${{ !cancelled() && steps.candidates.outcome == 'success' }}
        shell: pwsh
        run: |
          $file = Join-Path $env:RUNNER_TEMP 'smollm2-360m-q4-k-m.gguf'
          python desktop/verify_live_bundled_inference.py --analytics-eval --candidate smollm2-360m-q4-k-m --candidate-file $file
