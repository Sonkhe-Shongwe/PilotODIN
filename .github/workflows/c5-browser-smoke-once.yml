# Exact one-use public Pillow verification; owned temporary CI slot.
name: C5 exact public Pillow nightly once 20261127
on:
  push:
    branches: [feature/live-dev-workspace-20261023]
    paths:
      - qa/c5_managed_dev/APPROVAL_BROWSER_SMOKE_ONCE_20261127.json
permissions:
  contents: read
jobs:
  pillow:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/feature/live-dev-workspace-20261023' && github.event.before == '79561c9dcc9fc23098e49ae6c4ed69a95127ef73' && github.event.after == github.sha && github.event.head_commit.id == github.sha && github.event.head_commit.message == 'Execute approved exact public Pillow nightly verification once' && github.run_attempt == 1 && github.event.forced == false && github.event.deleted == false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      C5_CHECKOUT_SOURCE: "4cbb1370227c180fda6a7b8e5c4e24297b2c672f"
      C5_CHECKOUT_TREE: "de82fc03accc8d110312d8760e9af808ab9088f3"
    steps:
      - name: Checkout exact approved source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: "4cbb1370227c180fda6a7b8e5c4e24297b2c672f"
          persist-credentials: false
          fetch-depth: 1
      - name: Verify exact source and syntax before acquisition
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$(id -u)" != 0
          test "$(git rev-parse HEAD)" = "$C5_CHECKOUT_SOURCE"
          test "$(git rev-parse 'HEAD^{tree}')" = "$C5_CHECKOUT_TREE"
          git diff --quiet HEAD --
          test -z "$(git status --porcelain)"
          test "$(git hash-object qa/c5_managed_dev/pillow_nightly_verify.py)" = f154b9417d56a405befc6fb02497015a83b4e23a
          /usr/bin/python3 -I -B -c 'from pathlib import Path; p=Path("qa/c5_managed_dev/pillow_nightly_verify.py"); compile(p.read_bytes(),str(p),"exec")'
          echo "C5_PILLOW_SOURCE_SYNTAX_PASS"
      - name: Verify exact publisher index and conditional wheel
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$(git rev-parse HEAD)" = "$C5_CHECKOUT_SOURCE"
          git diff --quiet HEAD --
          /usr/bin/python3 -I -B qa/c5_managed_dev/pillow_nightly_verify.py
