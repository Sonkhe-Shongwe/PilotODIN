name: P1 Isolated Frontend Verification

# Only direct changes to the trusted P1 feature branch run this workflow.
# Public fork PRs do not automatically receive a test job or token.
on:
  push:
    branches:
      - feature/live-dev-workspace-20261023
    paths:
      - .github/workflows/p1-isolated-frontend.yml
      - frontend/package.json
      - frontend/package-lock.json
      - frontend/playwright.config.ts
      - frontend/tsconfig.json
      - frontend/vite.config.ts
      - frontend/index.html
      - frontend/public/**
      - frontend/src/**
      - frontend/tests/**
      - frontend/e2e/**

permissions:
  contents: read

concurrency:
  group: pilotodin-p1-isolated-feature-20261023
  cancel-in-progress: true

jobs:
  synthetic-frontend:
    name: Source contracts, TypeScript/Vite and 5 isolated Chromium cases
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CI: "true"
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout source without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Use Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked frontend dependencies
        run: npm ci --no-audit --no-fund
      - name: Check isolation, primary exit, route and unload contracts
        run: >-
          node --test
          tests/p1-playwright-pilot-contract.test.cjs
          tests/p1-primary-canvas-exit.test.cjs
          tests/p1-external-route-activation-guard.test.cjs
          tests/p1-primary-draft-switch-safety.test.cjs
          tests/p1-native-project-switch-consent.test.cjs
          tests/p1-unsaved-reload-guard.test.cjs
          tests/p1-primary-button-edit-markers.test.cjs
          tests/p1-predict-request-staleness.test.cjs
          tests/p1-quality-retry-reconnect.test.cjs
          tests/p1-quality-approval-focus.test.cjs
          tests/p1-quality-investigation-staleness.test.cjs
          tests/project-operation-guard.test.cjs
          tests/project-manager.test.cjs
          tests/p1-primary-project-load-approval.test.cjs
          tests/p1-project-switch-generation.test.cjs
          tests/p1-live-profile-version-order.test.cjs
      - name: Typecheck and compile frontend
        run: npm run build
      - name: Install Chromium for synthetic browser tests
        run: npx --no-install playwright install --with-deps chromium
      - name: Run 5 targeted P1 synthetic browser scenarios
        run: npx --no-install playwright test --config=playwright.config.ts -g "keyboard Tab Shift-Tab|keyboard dock resize|simulated 150 percent|primary Studio dirty Prepare cannot enter Investigation|isolated import Quality and failed project switch"
