name: R3 ML single-slot synthetic Windows regression

# Workstation ML admission safety on isolated synthetic SQLite only.
# Exact source branch, no owner data, native Tauri, installer, or P5 launch.
on:
  push:
    branches:
      - fix/r3-ml-slot-all-policies-20261123

permissions:
  contents: read

jobs:
  windows-synthetic-slot:
    runs-on: windows-2022
    timeout-minutes: 25
    env:
      CI: "true"
      PYTHONDONTWRITEBYTECODE: "1"
      PILOTODIN_HOME: ${{ runner.temp }}/pilotodin-r3-slot-${{ github.run_id }}
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Python 3.11
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"
      - name: Install existing backend test dependencies
        run: python -m pip install -r backend/requirements-test.txt
      - name: Compile changed Python
        run: python -B -m compileall -q backend/main.py backend/storage.py tests/test_p5_ml_training_slot.py
      - name: Run bounded source-only regressions
        run: >-
          python -B -m pytest -q -p no:cacheprovider
          tests/test_p5_ml_training_slot.py
          tests/test_p5_training_cancellation.py
          tests/test_p1_resource_admission.py
          tests/test_p1_resource_policy.py
          tests/test_p1_project_lifecycle.py
