name: P4 R03 SmolLM2 follow-up evaluation

# One hosted candidate run approved on 14 November 2026.
on:
  push:
    branches:
      - feature/live-dev-workspace-20261023
    paths:
      - .github/workflows/p4-r03-smollm2-wording-evaluation.yml

permissions:
  contents: read

jobs:
  evaluate:
    if: >-
      github.run_attempt == '1' &&
      github.event.head_commit.message == 'test(p4): run approved hosted SmolLM2 follow-up evaluation'
    runs-on: windows-2022
    timeout-minutes: 20
    env:
      EVALUATION_SOURCE: 04eb36e21121bdf77aaec9782174258fb976cbfb
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Verify evaluation source and runner memory
        shell: pwsh
        run: |
          $parent = (git rev-parse HEAD^).Trim()
          if ($parent -ne $env:EVALUATION_SOURCE) { throw 'Unexpected evaluation source' }
          git diff --exit-code $env:EVALUATION_SOURCE HEAD -- desktop
          if ($LASTEXITCODE -ne 0) { throw 'Harness differs from the approved source' }
          $hostOs = Get-CimInstance Win32_OperatingSystem
          Write-Host ('Hosted runner RAM: {0:N2} GiB visible, {1:N2} GiB free at preflight' -f ($hostOs.TotalVisibleMemorySize / 1MB), ($hostOs.FreePhysicalMemory / 1MB))
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Stage the pinned baseline and CPU runtime for integrity verification
        shell: pwsh
        run: ./desktop/Stage_Pinned_Offline_AI.ps1
      - name: Stage and measure only SmolLM2 360M
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $spec = python -c "import json, sys; sys.path.insert(0, 'desktop'); from offline_analytics_cases import CANDIDATES; print(json.dumps(CANDIDATES['smollm2-360m-q4-k-m']))"
          if ($LASTEXITCODE -ne 0) { throw 'Could not read pinned SmolLM2 specification' }
          $url, $size, $digest = $spec | ConvertFrom-Json
          $file = Join-Path $env:RUNNER_TEMP 'smollm2-360m-q4-k-m.gguf'
          Invoke-WebRequest -Uri $url -OutFile $file -MaximumRedirection 10
          if ((Get-Item -LiteralPath $file).Length -ne $size -or
              (Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash -ine $digest) {
            throw 'SmolLM2 integrity verification failed'
          }
          Write-Host "Verified SmolLM2: $size bytes"
          python desktop/verify_live_bundled_inference.py --wording-eval --candidate smollm2-360m-q4-k-m --candidate-file $file
          if ($LASTEXITCODE -ne 0) { throw 'SmolLM2 evaluation failed' }
