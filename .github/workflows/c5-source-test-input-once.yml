name: C5 source-test input one-use
on:
  push:
    branches: [feature/live-dev-workspace-20261023]
    paths:
      - qa/c5_wheel_metadata/APPROVAL_SOURCE_TEST_INPUT_ONCE_20261126.txt
permissions:
  contents: read
jobs:
  rehearsal:
    if: ${{ false }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Existing cached CP311 and pip only, no setup or download
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($IsWindows) {
            $python = Join-Path $env:RUNNER_TOOL_CACHE 'Python/3.11.9/x64/python.exe'
          } else {
            $python = Join-Path $env:RUNNER_TOOL_CACHE 'Python/3.11.18/x64/bin/python3.11'
          }
          if (-not (Test-Path -LiteralPath $python -PathType Leaf)) { throw 'Existing interpreter unavailable' }
          & $python -I -B qa/c5_wheel_metadata/source_test_input_once.py --rehearse
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
  windows-once:
    if: ${{ github.event_name == 'push' && github.run_attempt == 1 && github.event.head_commit.message == 'C5-SOURCE-TEST-INPUT-ONCE-20261126 owner approved exact source-test dry-run only' }}
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Exact Windows source-test archive hashes and offline dry-run
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $python = Join-Path $env:RUNNER_TOOL_CACHE 'Python/3.11.9/x64/python.exe'
          if (-not (Test-Path -LiteralPath $python -PathType Leaf)) { throw 'Existing interpreter unavailable' }
          & $python -I -B qa/c5_wheel_metadata/source_test_input_once.py --live
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
  linux-once:
    if: ${{ github.event_name == 'push' && github.run_attempt == 1 && github.event.head_commit.message == 'C5-SOURCE-TEST-INPUT-ONCE-20261126 owner approved exact source-test dry-run only' }}
    needs: windows-once
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Exact Linux source-test archive hashes and offline dry-run
        shell: bash
        run: |
          set -euo pipefail
          python="$RUNNER_TOOL_CACHE/Python/3.11.18/x64/bin/python3.11"
          test -f "$python"
          "$python" -I -B qa/c5_wheel_metadata/source_test_input_once.py --live
