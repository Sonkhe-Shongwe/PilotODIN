name: P4 Read-Only Windows Integrity Evidence Probe

# A small Windows CI probe using FAKE EXEs and SYNTHETIC files only.
# No model downloads, build tools, desktop installer, training or owner PC access.
on:
  push:
    branches:
      - feature/live-dev-workspace-20261023
    paths:
      - .github/workflows/p4-readonly-windows-probe.yml
      - qa/p4_native/Measure_P4_Native_Readiness.ps1
      - qa/p4_native/Test_P4_Native_Readiness_Probe.ps1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-readonly-probe:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - name: Checkout trusted source without saving credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify Windows probe on generated disposable fake files only
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ./qa/p4_native/Test_P4_Native_Readiness_Probe.ps1
