name: C5 wheel archive v2 synthetic review
on:
  push:
    branches: [feature/live-dev-workspace-20261023]
    paths:
      - qa/c5_wheel_metadata/wheel_archive_inspector_v2.py
      - qa/c5_wheel_metadata/test_wheel_archive_inspector_v2.py
      - .github/workflows/c5-wheel-archive-v2-review.yml
permissions:
  contents: read
jobs:
  synthetic-v2:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Historical pins and synthetic v1/v2 fixtures
        shell: bash
        run: |
          set -e
          test "$(git rev-parse HEAD:qa/c5_wheel_metadata/wheel_archive_inspector.py)" = aa5ab610d711fb8f9bc1fce1020c4999e53f3571
          test "$(git rev-parse HEAD:qa/c5_wheel_metadata/test_wheel_archive_inspector.py)" = 58bd7724e2e47307e90bdfe6fb17864203d804dc
          test "$(git rev-parse HEAD:qa/c5_wheel_metadata/wheel_notice_evidence.py)" = 141f069706d0c597214829eea90a48197c381e2c
          test "$(git rev-parse HEAD:qa/c5_wheel_metadata/wheel_missing_hosted.py)" = 73311acf23aa6653c534678dd7710ff1a4e6a150
          test "$(git rev-parse HEAD:.github/workflows/c5-wheel-missing-hosted.yml)" = 7bf52665598af6619de024f143288ab626f7ccc2
          test ! -e qa/c5_wheel_metadata/APPROVAL_WHEEL_MISSING_HOSTED_20261126.txt
          python --version
          python -I -B qa/c5_wheel_metadata/test_wheel_archive_inspector.py
          python -I -B qa/c5_wheel_metadata/test_wheel_archive_inspector_v2.py
      - name: Direct v2 acquisition refusal
        shell: bash
        run: |
          set +e
          result=$(python -I -B qa/c5_wheel_metadata/wheel_archive_inspector_v2.py --collect 2>&1)
          code=$?
          set -e
          printf '%s\n' "$result"
          test "$code" = 1
          test "$result" = 'OFFLINE_LIBRARY_ONLY: v2 no acquisition or arbitrary wheel CLI'
