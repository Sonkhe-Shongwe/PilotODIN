name: C5 missing wheel metadata offline review
on:
  push:
    branches: [feature/live-dev-workspace-20261023]
    paths:
      - .github/workflows/c5-wheel-missing-review.yml
      - qa/c5_wheel_metadata/collect_missing.py
permissions:
  contents: read
jobs:
  offline-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - run: python3 -I -B qa/c5_wheel_metadata/collect_missing.py --self-test
      - name: Assert CLI refuses collection
        run: |
          set +e
          python3 -I -B qa/c5_wheel_metadata/collect_missing.py --collect
          code=$?
          set -e
          test "$code" = 2
  collect-once:
    if: ${{ false }} # No new owner approval, proposed scope only.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - run: python3 -I -B qa/c5_wheel_metadata/collect_missing.py --self-test
      # Future exact activation must bind the reviewed blob, marker, exact
      # commit message and attempt 1; no replay or implicit cap expansion.
      - name: Missing metadata only (currently unreachable)
        env:
          C5_APPROVED_ONCE: C5-SELECTED-WHEEL-METADATA-MISSING-ONCE-20261125
          C5_EXPECTED_SOURCE_SHA: ${{ github.sha }}
        run: python3 -I -B qa/c5_wheel_metadata/collect_missing.py --collect
