name: P4 N12 Approved Origin Stack Capture

on:
  push:
    branches:
      - feature/live-dev-workspace-20261023
    paths:
      - .github/workflows/p4-n12-origin-stack.yml

permissions:
  contents: read

jobs:
  origin-stack:
    if: github.run_attempt == '1' && github.event.head_commit.message == 'test(p4): run approved N12 origin stack capture'
    name: Capture generated N12 write and resize stacks
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact capture source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Run the one approved generated-file capture
        shell: pwsh
        run: ./qa/p4_research/n12_stack/Run.ps1
