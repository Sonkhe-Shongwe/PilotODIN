name: P4 Target Review Queue and Transparent Ranking

# Synthetic data and local test services only. Run the fitted BE-024 browser
# case through its separately approved, one-use Windows workflow.
# Detached preparation only: never publish this variant to the live branch.
on:
  push:
    branches:
      - feature/dla-stage1-archive-20261128

permissions:
  contents: read

concurrency:
  # Recovery-only isolation: previous group's zero-job queued run cannot be
  # cancelled (GitHub API HTTP 409). Keep CI source-only, no installer jobs.
  group: pilotodin-p4-ranking-recovery-20261112-${{ github.ref }}
  cancel-in-progress: true

jobs:
  p4-synthetic-source-and-frontend:
    if: ${{ false }} # TEMPORARY_C5_HOLD: original full regression remains mandatory; restore only after reviewed input-use clearance.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: "true"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout exact trusted feature branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Python 3.11
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"
      - name: Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Validate blocked build-input policy and pinned source identity
        run: python -B tools/build_input_preflight.py --audit-policy
      - name: Check existing npm lock structure
        run: node frontend/scripts/verify-npm-lock.mjs
      - name: Install existing declared test dependencies
        run: |
          python -m pip install -r backend/requirements-test.txt
          npm ci --prefix frontend --no-audit --no-fund
      - name: Review pinned Python release graphs offline (candidate only)
        run: python -B -m qa.c5_metadata.graph_review
      - name: Review non-executable candidate input inventory offline
        run: python -B -m qa.c5_metadata.input_inventory --summary
      - name: Exercise standalone Rust storage policy on disposable Linux paths
        run: |
          rustc --edition=2021 --test frontend/src-tauri/src/storage_profile_tests.rs -o "$RUNNER_TEMP/pilotodin-storage-policy-tests"
          "$RUNNER_TEMP/pilotodin-storage-policy-tests"
          rm -f "$RUNNER_TEMP/pilotodin-storage-policy-tests"
      - name: Record exact existing Linux development toolchain
        run: |
          python -I -B -c "import sys,struct,platform,importlib.metadata as m; assert sys.implementation.name == 'cpython' and sys.version_info[:2] == (3,11) and struct.calcsize('P') == 8; print('C5_TOOLCHAIN Python',platform.python_version(),platform.system(),platform.machine(),'pip',m.version('pip'))"
          python -I -B -m pip --isolated --disable-pip-version-check --version
          python -I -B -m pip --isolated --disable-pip-version-check --no-input check
          node --version
          npm --version
          rustc -Vv
          cargo --version
      - name: Verify Python-only workspace writer lease
        run: python -B -m unittest -v tests.test_workspace_boundary tests.test_owned_server
      - name: Compile changed backend code
        run: python -m py_compile backend/target_opportunities.py backend/target_timing_review.py
      - name: Run focused existing and new P4 backend suites on synthetic data
        env:
          PILOTODIN_HOME: ${{ runner.temp }}/pilotodin-p4-review-${{ github.run_id }}
        run: >-
          python -m pytest -q
          tests/test_p4_target_opportunities.py
          tests/test_p4_bike_public_import.py
          tests/test_p4_bike_time_readiness.py
          tests/test_p4_bike_categorical_readiness.py
          tests/test_p4_target_business_context.py
          tests/test_p4_prediction_timing_review.py
          tests/test_p4_two_axis_evidence.py
          tests/test_p4_review_queue.py
          tests/test_p4_manual_target_inspection.py
          tests/test_p4_queue_resource_bounds.py
          tests/test_p4_consolidated_acceptance.py
          tests/test_p4_r03_worker_comparison.py
          tests/test_p4_r03_verified_answers.py
          tests/test_build_e_autonomous_investigations.py
          tests/test_p1_resource_admission.py
          tests/test_p4_phase_exit_matrix.py
          tests/test_p4_native_acceptance_kit.py
          tests/test_p4_n12_trace.py
          tests/test_p4_n12_same_capture_restore.py
          tests/test_p4_n12_webview_replay.py
          tests/test_p4_r06_prospective_fingerprint.py
          tests/test_p4_n12_worker_scratch_source.py
          tests/test_p4_n12_app_build.py
          tests/test_p4_n12_mutation_triage.py
          tests/test_p4_n12_ambient_local_candidate.py
          tests/test_p4_n12_app_journey.py
          tests/test_p4_n12_app_lifetime.py
          tests/test_p4_n12_no_cdp_fileio_review.py
          tests/test_p4_n12_lifetime_control.py
          tests/test_p4_n12_lifetime_etw.py
          tests/test_p4_n12_exit_corroboration.py
          tests/test_p4_n12_egress.py
          tests/test_p4_n12_journey_diagnostics.py
          tests/test_p4_n12_webview_storage.py
          tests/test_p4_n12_no_cdp_native_path.py
          tests/test_p4_n12_no_cdp_lifecycle.py
          tests/test_p4_n12_no_cdp_main_window.py
          tests/test_p4_n12_no_cdp_browser_identity.py
          tests/test_p4_n12_no_cdp_child_handles.py
          tests/test_p4_n12_private_child_pipe.py
          tests/test_p4_n12_source_evidence_map.py
          tests/test_p4_n12_no_cdp_log_witness.py
          tests/test_p4_n12_calibration_socket_pair.py
          tests/test_p4_n12_protected_fixture_contract.py
          tests/test_p4_n12_product_tree_isolation_review.py
          tests/test_p4_n12_webview_storage_mechanism_map.py
          tests/test_p4_n12_fileio_identity_join.py
          tests/test_p4_n12_token_capability_preflight.py
          tests/test_p4_n12_tmp_debugger_fixture.py
          tests/test_p4_n12_procmon_environment_control.py
          tests/test_p4_installer_provenance.py
          tests/test_c5_build_input_preflight.py
      - name: Exercise historical bundle preflight refusal cases only
        run: python -B -m pytest -q tests/test_build_e_offline_inference.py -k bundle_preflight
      - name: Verify P4 source contracts and manual target choice
        run: >-
          node --test
          frontend/tests/p4-target-opportunities-contracts.test.cjs
          frontend/tests/p4-business-context-contracts.test.cjs
          frontend/tests/p4-prediction-timing-contracts.test.cjs
          frontend/tests/p4-two-axis-contracts.test.cjs
          frontend/tests/p4-review-queue-contracts.test.cjs
          frontend/tests/ml-a3-feature-preparation.test.cjs
          frontend/tests/p4-75-selected-feature-budget.test.cjs
          frontend/tests/p1-primary-button-edit-markers.test.cjs
          frontend/tests/p4-native-dev-isolation.test.cjs
          frontend/tests/c5-npm-lock.test.cjs
          frontend/tests/a4-native-smoke-runner.test.cjs
          frontend/tests/desktop-ai-boundaries.test.cjs
          frontend/tests/p1-resource-settings.test.cjs
          frontend/e2e/p4-72-cdp-target-classifier.test.mjs
          frontend/e2e/p4-73-cdp-target-discovery.test.mjs
          frontend/e2e/p4-n12-native-close-readiness.test.mjs
          frontend/e2e/p4-n12-app-lifetime-ready.test.mjs
          frontend/e2e/p4-n12-native-cases.test.mjs
      - name: Build actual TypeScript and Vite bundle
        run: npm run build --prefix frontend

  p4-disposable-real-http-browser:
    if: ${{ false }} # TEMPORARY_C5_HOLD: original full regression remains mandatory; restore only after reviewed input-use clearance.
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    env:
      CI: "true"
      P1_REAL_HTTP_E2E: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Set exact CI-owned disposable backend home
        run: echo "PILOTODIN_HOME=${RUNNER_TEMP}/pilotodin-p1-real-http-${GITHUB_RUN_ID}" >> "$GITHUB_ENV"
      - name: Checkout trusted branch without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Python 3.11
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"
      - name: Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install existing backend and frontend test dependencies
        run: |
          python -m pip install -r backend/requirements-test.txt
          npm ci --prefix frontend --no-audit --no-fund
      - name: Install isolated headless Chromium
        working-directory: frontend
        run: npx --no-install playwright install --only-shell chromium
      - name: Test actual P4 review queue against disposable real HTTP backend
        working-directory: frontend
        run: >-
          npx --no-install playwright test --config=playwright.p4-real-http.config.ts
          --grep-invert 'BE-024 real HTTP: reopen a fitted synthetic experiment'


  p4-r03-windows-local-answers:
    if: ${{ false }} # TEMPORARY_C5_HOLD: original full regression remains mandatory; restore only after reviewed input-use clearance.
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"
      - name: Install existing backend test requirements
        run: python -m pip install -r backend/requirements-test.txt
      - name: Compile Windows storage-policy code and tests to object only
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $object = Join-Path $env:RUNNER_TEMP 'pilotodin-storage-policy.obj'
          try {
            rustc --edition=2021 --test --emit=obj frontend/src-tauri/src/storage_profile_tests.rs -o $object
            if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $object)) { throw 'Rust object compilation failed' }
          } finally {
            if (Test-Path -LiteralPath $object) { Remove-Item -LiteralPath $object -Force }
          }
      - name: Record exact existing Windows development toolchain and Python compatibility
        run: |
          python -I -B -c "import sys,struct,platform,importlib.metadata as m; assert sys.implementation.name == 'cpython' and sys.version_info[:2] == (3,11) and struct.calcsize('P') == 8; print('C5_TOOLCHAIN Python',platform.python_version(),platform.system(),platform.machine(),'pip',m.version('pip'))"
          python -I -B -m pip --isolated --disable-pip-version-check --version
          python -B -c "import sys; from pathlib import Path; from tools import live_dev; live_dev.verify_python_environment(Path(sys.executable),Path(sys.prefix),Path('backend/requirements.txt')); print('C5_HOSTED_PYTHON_DEV_COMPATIBILITY_PASS')"
          node --version
          npm --version
          node frontend/scripts/verify-npm-lock.mjs
          rustc -Vv
          cargo --version
      - name: Parse C5 guarded Windows source entrypoints without running them
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($file in @('desktop/Build_Windows_Installer.ps1','desktop/Verify_Frontend_Windows.ps1', 'tools/Verify_A4_Native_Windows.ps1', 'tools/Verify_P2_Native_Export_Local.ps1', 'desktop/Verify_Installed_PilotODIN.ps1','desktop/Build_Python_Sidecar.ps1','desktop/Stage_Pinned_Offline_AI.ps1','desktop/Stage_Bundled_Inference.ps1')) {
            $tokens = $null
            $parseErrors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file).Path, [ref]$tokens, [ref]$parseErrors)
            if ($parseErrors.Count) { throw 'C5 entrypoint parser failed' }
          }
      - name: Exercise C5 synthetic source guard fixtures
        run: python -B -m pytest -q tests/test_c5_build_input_preflight.py
      - name: Exercise historical bundle preflight refusal cases only
        run: python -B -m pytest -q tests/test_build_e_offline_inference.py -k bundle_preflight
      - name: Measure exact local answers at simulated laptop headroom
        run: python -B qa/p4_research/measure_local_answers.py
      - name: Verify engine shutdown with and without a desktop owner
        run: python -m pytest -q tests/test_packaged_engine_smoke.py tests/test_desktop_runner_process_smoke.py tests/test_workspace_boundary.py tests/test_owned_server.py

  p4-readonly-windows-probe:
    if: ${{ false }} # Real Windows ETW fixtures require fresh explicit native scope; retain job body.
    name: Exercise preservation/hash collector on synthetic Windows fixture ONLY
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - name: Checkout trusted source without retained credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Python 3.11 for N12 synthetic Windows fixture
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"
      - name: Exercise authenticated Windows AF_PIPE with synthetic subprocess witnesses ONLY
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:PYTHONDONTWRITEBYTECODE = '1'
          python -B -m unittest -v tests.test_p4_n12_private_child_pipe_windows
          if ($LASTEXITCODE -ne 0) { throw 'Synthetic Windows AF_PIPE contract tests failed.' }
      - name: Verify hosted temp resolution and generated WebView storage cases
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          python -B -c 'import os; from qa.p4_research.n12_webview_storage_probe import runner_control_temp; runner_control_temp(os.environ); print("Hosted temp preflight passed")'
          python -B -m unittest discover -s tests -p test_p4_n12_ambient_local_candidate.py
          python -B -m unittest discover -s tests -p test_p4_n12_worker_scratch_source.py
          python -B -m unittest discover -s tests -p test_p4_n12_mutation_triage.py
          python -B -m unittest discover -s tests -p test_p4_n12_webview_storage.py
          python -B -m unittest discover -s tests -p test_p4_n12_no_cdp_native_path.py
          python -B -m unittest discover -s tests -p test_p4_n12_no_cdp_lifecycle.py
          python -B -m unittest discover -s tests -p test_p4_n12_no_cdp_main_window.py
          python -B -m unittest discover -s tests -p test_p4_n12_no_cdp_browser_identity.py
          python -B -m unittest discover -s tests -p test_p4_n12_no_cdp_log_witness.py
          python -B -m unittest discover -s tests -p test_p4_n12_calibration_socket_pair.py
          python -B -m unittest discover -s tests -p test_p4_n12_protected_fixture_contract.py
          python -B -m unittest discover -s tests -p test_p4_n12_token_capability_preflight.py
          python -B -m qa.p4_research.n12_token_capability_preflight
      - name: Positive and negative read-only integrity cases on fake app files
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ./qa/p4_native/Test_P4_Native_Readiness_Probe.ps1
          ./qa/p4_native/Test_P4_Original_Storage_Compare.ps1
          ./qa/p4_native/Test_P4_WebView_Process_Evidence.ps1
      - name: Verify original-storage and WebView safety on Windows PowerShell 5.1
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if ($PSVersionTable.PSVersion.Major -ne 5) { throw 'Expected Windows PowerShell 5.1, not pwsh.' }
          foreach ($script in @(
            'Invoke_P4_Native_Project_Switch_Dialog.ps1',
            'Invoke_P4_Native_Project_Switch_Control.ps1',
            'Run_P4_71_Disposable_Windows.ps1',
            'Export_P4_N12_Sysmon_Trace.ps1',
            'Test_P4_Native_Project_Switch_Automation.ps1'
          )) {
            $path = Join-Path (Resolve-Path './qa/p4_native').Path $script
            $tokens = $null
            $parseErrors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$tokens, [ref]$parseErrors)
            if ($parseErrors.Count) { throw ($parseErrors -join [Environment]::NewLine) }
          }
          ./qa/p4_native/Test_P4_Original_Storage_Compare.ps1
          ./qa/p4_native/Test_P4_WebView_Process_Evidence.ps1
      - name: Verify the everyday RAM sampler with Windows counters and generated fixtures
        shell: powershell
        run: ./qa/p4_native/Test_P4_Everyday_RAM_Baseline.ps1
      - name: Verify offline Qwen benchmark evidence and profile preservation
        shell: powershell
        run: ./qa/p4_native/Test_P4_R03_Offline_Launcher.ps1
      - name: Exercise Windows UI Automation against a synthetic dialog
        shell: powershell
        run: ./qa/p4_native/Test_P4_Native_Project_Switch_Automation.ps1
      - name: Verify close status for a Windows process opened by PID
        shell: pwsh
        run: ./qa/p4_native/Test_P4_Verified_Window_Close.ps1
      - name: Verify N12 collector exit and backing-file checks on synthetic inputs
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          foreach ($script in @(
            './qa/p4_native/Invoke_P4_N12_Live_Calibration.ps1',
            './qa/p4_native/Test_P4_N12_ETW_Fixture.ps1',
            './qa/p4_research/Invoke_N12_Journey_Evidence.ps1'
          )) {
            $source = (Resolve-Path $script).Path
            [void][System.Management.Automation.Language.Parser]::ParseFile($source, [ref]$tokens, [ref]$parseErrors)
            if ($parseErrors.Count) { throw ($parseErrors -join [Environment]::NewLine) }
          }
          ./qa/p4_native/Test_P4_N12_Collector_Process.ps1

      - name: Verify prospective R06 endpoint evidence on generated files
        run: python -B -m unittest discover -s tests -p test_p4_r06_prospective_fingerprint.py
      - name: Verify generated Process Monitor environment evidence without live capture
        run: python -B -m unittest tests.test_p4_n12_procmon_environment_control
      - name: Verify Windows dialog actions, retained child handles and driver scratch
        run: python -B -m unittest discover -s tests -p test_p4_n12_exit_corroboration.py
      - name: Check egress rule decisions and parse the Windows command
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          python -B -m unittest discover -s tests -p test_p4_n12_egress.py
          $source = python -B -c 'from qa.p4_research.n12_egress import FIREWALL_COMMAND; print(FIREWALL_COMMAND)'
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseInput(($source -join "`n"), [ref]$tokens, [ref]$errors)
          if ($errors) { throw 'The egress firewall command did not parse.' }
      - name: Exercise N12 snapshot and calibration on generated files
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:PYTHONDONTWRITEBYTECODE = '1'
          $fixture = Join-Path $env:RUNNER_TEMP "pilotodin-n12-fixture-$env:GITHUB_RUN_ID"
          New-Item -ItemType Directory -Path $fixture | Out-Null
          $original = Join-Path $fixture 'protected'
          $observed = Join-Path $fixture 'input.csv'
          $manifest = Join-Path $fixture 'manifest.json'
          $before = Join-Path $fixture 'before.json'
          $after = Join-Path $fixture 'after.json'
          New-Item -ItemType Directory -Path $original | Out-Null
          Set-Content -LiteralPath (Join-Path $original 'unchanged.txt') -Value 'generated'
          Set-Content -LiteralPath $observed -Value @('id,amount','1,20')
          @{
            disposable = $true
            protected_roots = @{ original = $original }
            observed_roots = @{ input = $observed }
            immutable_observed = @('input')
            permitted_writes = @{ calibration = @((Join-Path $fixture 'calibration')) }
          } | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath $manifest -Encoding utf8
          python qa/p4_native/n12_trace.py snapshot $manifest $before
          if ($LASTEXITCODE -ne 0) { throw 'N12 synthetic baseline failed.' }
          $output = python qa/p4_native/n12_calibration.py (Join-Path $fixture 'calibration')
          if ($LASTEXITCODE -ne 0) { throw 'N12 synthetic loopback/file calibration failed.' }
          $calibration = $output | ConvertFrom-Json
          if ($calibration.role -ne 'calibration' -or $calibration.port -le 0 -or
              (Test-Path -LiteralPath $calibration.fixture) -or
              (Test-Path -LiteralPath $calibration.renamed_fixture)) {
            throw 'N12 calibration evidence inconsistent.'
          }
          $creation = [long]$calibration.parent_created_utc_ticks
          $now = [DateTime]::UtcNow
          if ($creation -lt $now.AddMinutes(-1).Ticks -or $creation -gt $now.AddSeconds(1).Ticks) {
            throw 'The generated fixture did not report a plausible Windows process creation time.'
          }
          python qa/p4_native/n12_trace.py snapshot $manifest $after
          if ($LASTEXITCODE -ne 0 -or
              (Get-FileHash -LiteralPath $before).Hash -ne (Get-FileHash -LiteralPath $after).Hash) {
            throw 'N12 synthetic preservation check failed.'
          }
          Write-Host 'N12 synthetic Windows snapshot and loopback/file operation fixture passed.'

      - name: Probe Windows ETW loss counters and generated fixture events
        shell: pwsh
        run: ./qa/p4_native/Test_P4_N12_ETW_Fixture.ps1

      - name: Verify the combined rehearsal fixture with ETW alone
        shell: pwsh
        run: ./qa/p4_native/Test_P4_N12_ETW_Fixture.ps1 -CalibrationOnly

      - name: Check ETW writes through handles opened before capture
        shell: pwsh
        run: ./qa/p4_native/Test_P4_N12_ETW_Fixture.ps1 -PreopenedControl

      - name: Compare Windows file-name rundown with known handle targets
        shell: pwsh
        run: ./qa/p4_native/Test_P4_N12_ETW_Fixture.ps1 -PreopenedControl -Rundown

  p4-dependency-free-source:
    name: DLA independent runtime archive inspection (DISARMED)
    if: ${{ false }} # No acquisition without separately approved exact activation.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      DLA_EXPECTED_BEFORE: "DISARMED"
      DLA_EXPECTED_DRIVER: "DISARMED"
    steps:
      - name: Checkout exact source without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 3
          persist-credentials: false
      - name: Verify one-use event, source and managed interpreter
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = push
          test "$GITHUB_REF" = refs/heads/feature/dla-stage1-archive-20261128
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$RUNNER_OS" = Linux
          test "$RUNNER_ARCH" = X64
          test "$(id -u)" -ne 0
          test "${ImageOS:-}" = ubuntu24
          test "${ImageVersion:-}" = 20261122.23.1
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "$DLA_EXPECTED_BEFORE"
          git merge-base --is-ancestor dad4b36e6f26aa1a3816057b34851e7fdac8a601 HEAD
          test "$(git diff --name-only dad4b36e6f26aa1a3816057b34851e7fdac8a601 HEAD)" = "$(printf '%s\n' '.github/workflows/p4-target-ranking.yml' 'qa/p4_research/dla_runtime_archive_inspection.py')"
          test "$(git rev-parse HEAD:qa/p4_research/dla_runtime_archive_inspection.py)" = "$DLA_EXPECTED_DRIVER"
          test "$(git rev-parse HEAD:qa/p4_research/dla_stage1_contract.py)" = 3ddd48e82355975c7344119c4cd3e0692e1b2805
