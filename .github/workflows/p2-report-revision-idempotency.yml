name: P2 Immutable Report Revision Idempotency

# Dedicated trusted-branch synthetic test. No owner datasets, fonts or installer.
on:
  push:
    branches:
      - feature/live-dev-workspace-20261023
    paths:
      - .github/workflows/p2-report-revision-idempotency.yml
      - backend/reports.py
      - backend/main.py
      - tests/test_p2_report_revision_idempotency.py
      - tools/p2_report_revision_idempotency_ci.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pilotodin-p2-revision-idempotency-${{ github.ref }}
  cancel-in-progress: true

jobs:
  report-revisions:
    name: Isolated actual FastAPI save/reopen/idempotency plus existing history
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CI: "true"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout trusted source without stored credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Python 3.11
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"
      - name: Install existing backend test dependencies
        run: python -m pip install -r backend/requirements-test.txt
      - name: Compile revision route and storage code
        run: python -m py_compile backend/reports.py backend/main.py tests/test_p2_report_revision_idempotency.py
      - name: Isolated disposable report HTTP and historical export tests
        run: python -B tools/p2_report_revision_idempotency_ci.py
