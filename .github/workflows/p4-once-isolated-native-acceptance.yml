name: P4 Owner-Approved ONE Native Unpackaged Windows Acceptance

# EXACTLY ONE owner authorisation, 12 Nov 2026:
# isolated Windows-native executable compilation on disposable GH runner
# and limited noninteractive runtime smoke. No installer, model, original
# owner data, transfer/install, P5, P8 or P4 exit is authorised.
# P4-47: one owner-authorised native CI ran and PASSED #43159387547.
# ARCHIVED, DISABLED. Never run preflight/compile again without NEW approval.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p4-one-native-acceptance-20261112
  cancel-in-progress: false

jobs:
  p4-preflight:
    if: ${{ false }} # one-time authorisation consumed; job permanently disabled
    name: Source and disposable Windows storage preflight, NO COMPILATION
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - name: Checkout exact pushed source without retained credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify commit and exact branch
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ((git rev-parse HEAD).Trim() -ne $env:GITHUB_SHA) { throw 'Source commit mismatch' }
          if ($env:GITHUB_REF_NAME -ne 'feature/live-dev-workspace-20261023') { throw 'Ref mismatch' }
      - name: Node 22 for source-only preflight
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - name: Verify original, QA, isolated identity and source storage on hosted Windows
        shell: pwsh
        run: node frontend/scripts/p4-one-time-native-ci-preflight.mjs

  p4-one-unpackaged-native:
    if: ${{ false }} # no second compile from this archived workflow
    needs: p4-preflight
    name: ONE isolated native EXE only, NO INSTALLER, no upload
    runs-on: windows-2022
    timeout-minutes: 65
    steps:
      - name: Checkout exact one-time authorised source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - name: RECHECK isolation on this second disposable Windows runner BEFORE compilation
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ((git rev-parse HEAD).Trim() -ne $env:GITHUB_SHA) { throw 'Exact source mismatch' }
          node frontend/scripts/p4-one-time-native-ci-preflight.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Mandatory native preflight refused' }
      - name: Install locked frontend dependencies (no native build)
        shell: pwsh
        run: npm ci --prefix frontend --no-audit --no-fund
      - name: Install Rust MSVC toolchain only after successful preflight
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: ONE approved isolated native compile, Tauri v2 --no-bundle
        shell: pwsh
        working-directory: frontend
        env:
          PILOTODIN_P4_ONE_NATIVE_CI_APPROVED: "owner-authorised-2026-11-12"
        run: |
          $ErrorActionPreference = 'Stop'
          node scripts/p4-one-time-native-ci-preflight.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Final precompile check refused' }
          npx --no-install tauri build --no-bundle --config src-tauri/tauri.p4-one-time-unpackaged-ci.conf.json
          if ($LASTEXITCODE -ne 0) { throw 'Unpackaged Tauri compilation failed. Do not try a second build under this approval.' }
      - name: Record compiled identity and check for unintended installer artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = 'frontend/src-tauri/target/release/pilotodin-desktop.exe'
          if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) { throw 'No native EXE compiled' }
          $sha = (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          $bytes = (Get-Item -LiteralPath $exe).Length
          $bundles = 'frontend/src-tauri/target/release/bundle'
          if (Test-Path -LiteralPath $bundles) {
            $packages = @(Get-ChildItem -LiteralPath $bundles -File -Recurse | Where-Object { $_.Extension -in @('.exe','.msi','.msix','.zip') })
            if ($packages.Count -gt 0) { throw 'Unapproved package/bundle output detected' }
          }
          Write-Host "UNPACKAGED NATIVE EXE COMPILED: SHA256=$sha bytes=$bytes"
          Write-Host 'NO NSIS/MSI/installer, NO artifact upload, NO model resources and NO owner machine used.'
      - name: Controlled limited native process/WebView smoke on disposable CI only
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $orig = Join-Path $env:LOCALAPPDATA 'com.pilotodin.studio'
          $olderQa = Join-Path $env:LOCALAPPDATA 'com.pilotodin.p4nativeqa'
          $isolated = Join-Path $env:LOCALAPPDATA 'com.pilotodin.p4isolatednativedev'
          $exe = (Resolve-Path 'frontend/src-tauri/target/release/pilotodin-desktop.exe').Path
          if ((Test-Path $orig) -or (Test-Path $olderQa)) { throw 'Protected app data appeared before native smoke' }
          $proc = $null
          try {
            $proc = Start-Process -FilePath $exe -WorkingDirectory (Split-Path $exe) -PassThru -ErrorAction Stop
            Start-Sleep -Seconds 12
            $proc.Refresh()
            $running = -not $proc.HasExited
            $webview = @(Get-CimInstance Win32_Process -Filter "Name = 'msedgewebview2.exe'" -ErrorAction SilentlyContinue |
              Where-Object { $_.CommandLine -and $_.CommandLine.Contains('com.pilotodin.p4isolatednativedev') })
            Write-Host ("BOUNDED NATIVE SMOKE: still_running={0}; isolated_local_data_present={1}; WebView2_isolated_profile_processes={2}" -f $running,(Test-Path $isolated),$webview.Count)
            if (-not $running) {
              Write-Host 'NATIVE RUNTIME EARLY EXIT: compiled source exists but UI smoke did not pass.'
              throw 'Native process exited before bounded smoke finished'
            }
          } finally {
            if ($proc) {
              try { if (-not $proc.HasExited) { Stop-Process -Id $proc.Id -Force -ErrorAction Stop } } catch { Write-Host 'Process already stopped or stop unavailable' }
            }
            if ((Test-Path $orig) -or (Test-Path $olderQa)) { throw 'Protected original or historic QA profile appeared during isolated smoke' }
            Write-Host 'STRICT: No production/installed QA directory created in disposable runner. Historical owner integrity NOT certified.'
          }
          Write-Host 'R02/R03/R04/R05 acceptance remains PARTIAL or UNTESTED: no native interactions, no full sidecar/Qwen/8GB hardware.'
