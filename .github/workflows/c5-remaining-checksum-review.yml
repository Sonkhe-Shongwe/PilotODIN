name: C5 remaining toolchain checksums offline review
on:
  push:
    branches: [feature/live-dev-workspace-20261023]
    paths:
      - qa/c5_wheel_metadata/APPROVAL_REMAINING_CHECKSUMS_20261126.txt
permissions:
  contents: read
jobs:
  collect-once:
    if: ${{ github.run_attempt == 1 && github.event.head_commit.message == 'C5-TOOLCHAIN-CHECKSUMS-REMAINING-ONCE-20261126 owner approved exact remaining checksum documents' && github.event.forced == false && github.event.created == false && github.event.deleted == false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Verify exact direct-child marker and collector blob
        env:
          EXPECTED_PARENT: ${{ github.event.before }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git show -s --format=%P HEAD)" = "$EXPECTED_PARENT"
          test "$(git diff-tree --no-commit-id --name-status -r HEAD)" = "$(printf 'A\tqa/c5_wheel_metadata/APPROVAL_REMAINING_CHECKSUMS_20261126.txt')"
          test "$(git hash-object qa/c5_wheel_metadata/collect_remaining_checksums.py)" = "cf11821ecf0fbf6f919c064c1b3719f914d70039"
          test "$(git show -s --format=%B HEAD)" = "C5-TOOLCHAIN-CHECKSUMS-REMAINING-ONCE-20261126 owner approved exact remaining checksum documents"
      - name: Offline self test
        run: python3 -I -B qa/c5_wheel_metadata/collect_remaining_checksums.py --self-test
      - name: Collect remaining exact documents once
        run: python3 -I -B qa/c5_wheel_metadata/collect_remaining_checksums.py --collect
        env:
          C5_APPROVED_ONCE: C5-TOOLCHAIN-CHECKSUMS-REMAINING-ONCE-20261126
          C5_EXPECTED_SOURCE_SHA: ${{ github.sha }}
