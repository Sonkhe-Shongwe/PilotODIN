name: P4-71 ONE Owner-Approved Isolated Windows Native Acceptance

# One explicit owner approval in conversation, 12 Nov 2026.
# Exactly one disposable Windows-2022 Tauri DEV build with a distinct app id.
# No installer, sidecar, Qwen, artifact upload, original app-data or owner PC.
# Owner-approved one-use run #43276316744 already dispatched; both jobs permanently disabled.
# Triggered only by the historic single-use marker, which must not be replayed.
on:
  push:
    branches:
      - feature/live-dev-workspace-20261023
    paths:
      - 'qa/p4_native/P4_71_OWNER_APPROVED_ONE_USE_TRIGGER_20261112.txt'

permissions:
  contents: read

concurrency:
  group: pilotodin-p4-71-one-time-native-test-20261112
  cancel-in-progress: false

jobs:
  p4-71-mandatory-preflight:
    if: ${{ false }} # single owner-approved P4-71 run dispatched, disabled after trigger
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - name: Checkout exact approved source without retained credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 3
      - name: Verify source parent and distinct app identities before native compilation
        shell: pwsh
        run: ./qa/p4_native/Run_P4_71_Disposable_Windows.ps1 -PreflightOnly

  p4-71-native-dev:
    needs: p4-71-mandatory-preflight
    if: ${{ false }} # no second compilation permitted without fresh consent
    name: ONE unpackaged native DEV compilation and controlled synthetic QA
    runs-on: windows-2022
    timeout-minutes: 100
    env:
      CI: 'true'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout exact source without retained credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 3
      - name: Recheck isolation preflight on compile runner
        shell: pwsh
        run: ./qa/p4_native/Run_P4_71_Disposable_Windows.ps1 -PreflightOnly
      - name: Python 3.11 for disposable loopback backend
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Node 22 for native smoke
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Rust MSVC for ONE unpackaged developer native build
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Install locked frontend and Python requirements without compilation
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          npm ci --prefix frontend --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'npm ci failed before native compilation' }
          python -m pip install -r backend/requirements.txt
          if ($LASTEXITCODE -ne 0) { throw 'Python requirements failed before native compilation' }
          node --check frontend/e2e/p4-71-native-webview-qa.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Native QA probe syntax check failed' }
      - name: Single native DEV compilation plus synthetic WebView2 QA
        shell: pwsh
        run: ./qa/p4_native/Run_P4_71_Disposable_Windows.ps1
      - name: Verify no installer and no output transfer
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bundle = 'frontend/src-tauri/target/debug/bundle'
          if (Test-Path -LiteralPath $bundle) {
            $packages = @(Get-ChildItem -LiteralPath $bundle -Recurse -File |
              Where-Object { $_.Extension -in @('.msi','.msix','.exe') })
            if ($packages.Count -gt 0) { throw 'FAIL: unexpected installer output' }
          }
          Write-Host 'NO INSTALLER, NO EXE TRANSFER/UPLOAD, NO OWNER PC ACCESS.'
